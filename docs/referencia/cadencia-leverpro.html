        mas não proíbe os demais: quando não cabe, aloca fora e mostra onde.</p>
      <div class="faixa-slots" id="faixaSlots">
        ${Array.from({ length: 20 }, (_, s) => {
          const fora = s < G.inicio || s >= G.fim;
          const alm = s >= G.almocoInicio && s < G.almocoInicio + G.almocoDur;

      </div>
      <p class="nota" style="margin-top:10px">Jornada útil de <b>${n1((G.fim - G.inicio - G.almocoDur) / 2)}h</b> por dia,
        descontado o almoço.</p>
    </section>
  </div>`;
}

function abaCargo() {
  const k = doCenario(semana1()).kpi;
  const CALC = [
    { lb: 'Cap. líquida', un: 'h/sem', id: 'cl' },
    { lb: 'Teto', un: 'h/sem', id: 'teto' },
    { lb: 'Limite', un: 'h/sem', id: 'tetomax' },
    { lb: 'Carga', un: 'h/sem', id: 'carga' },
    { lb: 'Situação', un: '', id: 'sit' }
  ];

  const colunas = `<colgroup>
    <col style="width:196px">
    ${CAMPOS.map(() => '<col style="width:88px">').join('')}
    ${CALC.map((c, i) => `<col style="width:${i === CALC.length - 1 ? 132 : 88}px">`).join('')}
  </colgroup>`;

  const cabGrupos = `<tr class="grupos">
    <th rowspan="2" class="fixa">Cargo</th>
    ${GRUPOS_PREM.map(g => `<th colspan="${g.campos.length}" class="grupo">${g.lb}</th>`).join('')}
    <th colspan="${CALC.length}" class="grupo calculado">Calculado pelo sistema</th>
  </tr>`;
  const cabCampos = `<tr class="subcab">
    ${GRUPOS_PREM.map(g => g.campos.map((kc, i) => { const f = campoDe(kc);
      return `<th class="n${i === 0 ? ' abre-grupo' : ''}" title="${esc(f.dica)}">${f.lb}<em>${f.un}</em></th>`;
    }).join('')).join('')}
    ${CALC.map((c, i) => `<th class="${c.id === 'sit' ? '' : 'n'} calculado${i === 0 ? ' abre-grupo' : ''}">${c.lb}<em>${c.un || '&nbsp;'}</em></th>`).join('')}
  </tr>`;

  const linhas = PAPEIS.map((pp, i) => {
    const c = premDe(CFG, pp), ps = pessoasDo(pp);
    const kps = k.porPessoa.filter(x => x.papel === pp);
    const carga = kps.length ? kps.reduce((s, x) => s + x.horas, 0) / kps.length : 0;
    const ocup = c.teto > 0 ? carga / c.teto * 100 : 0;
    const acima = kps.filter(x => x.acimaLimite).length, cedidos = kps.filter(x => x.acimaTeto).length;
    const sit = !ps.length ? selo('sem ninguém', 'ruim')
      : acima ? selo(acima + ' acima do limite', 'ruim')
      : cedidos ? selo(cedidos + ' com concessão', 'aviso')
      : ocup > 85 ? selo(n0(ocup) + '% do teto', 'acento')
      : ocup < 45 ? selo(n0(ocup) + '% do teto', 'neutro') : selo(n0(ocup) + '% do teto', 'ok');
    let celulas = '';
    GRUPOS_PREM.forEach(g => g.campos.forEach((kc, j) => {
      const f = campoDe(kc);
      celulas += `<td class="edt${j === 0 ? ' abre-grupo' : ''}"><input class="cel-edit" type="number"
        data-papel="${esc(pp)}" data-campo="${f.k}" min="${f.min}" max="${f.max}" step="${f.passo}"
        value="${PREM[pp][f.k] / f.esc}" aria-label="${esc(f.lb)} ${esc(f.un)} de ${esc(pp)}"></td>`;
    }));
    return `<tr>
      <td class="fixa"><b>${esc(pp)}</b><div class="meta">${ps.length ? ps.length + ' pessoa(s)' : 'sem ninguém'}</div></td>
      ${celulas}
      <td class="n calc abre-grupo" data-calc="cl-${i}">${n1(c.Cl)}</td>
      <td class="n calc" data-calc="teto-${i}">${n1(c.teto)}${c.limitadoPorHoras ? '<em class="flag">absoluto</em>' : ''}</td>
      <td class="n calc" data-calc="tetomax-${i}">${n1(c.tetoMax)}</td>
      <td class="n calc" data-calc="carga-${i}">${n1(carga)}</td>
      <td class="calc" data-calc="sit-${i}">${sit}</td>
    </tr>`;
  }).join('');

  const totalPessoas = PAPEIS.reduce((s, pp) => s + pessoasDo(pp).length, 0);
  const capTotal = PAPEIS.reduce((s, pp) => s + premDe(CFG, pp).Cl * pessoasDo(pp).length, 0);
  const tetoTotal = PAPEIS.reduce((s, pp) => s + premDe(CFG, pp).teto * pessoasDo(pp).length, 0);
  const cargaTotal = k.porPessoa.reduce((s, x) => s + x.horas, 0);

  return `<section class="sec">
    <div class="sec-cab"><h2>Premissas por cargo</h2>
      <span class="apoio">
        <button class="mini-btn" id="btnRestaurar">Restaurar padrões</button>
        <button class="mini-btn" id="btnIrCargos">Cadastrar cargos</button></span></div>

    <div class="resumo-prem">
      <div><span>Cargos</span><b>${PAPEIS.length}</b></div>
      <div><span>Pessoas</span><b>${totalPessoas}</b></div>
      <div><span>Capacidade líquida</span><b data-resumo="cap">${n1(capTotal)} h</b></div>
      <div><span>Teto de reunião</span><b data-resumo="teto">${n1(tetoTotal)} h</b></div>
      <div><span>Carga da semana</span><b data-resumo="carga" style="color:var(--${cargaTotal > tetoTotal ? 'bad' : 'ok'})">${n1(cargaTotal)} h</b></div>
      <div><span>Ocupação do teto</span><b data-resumo="ocup">${n0(tetoTotal ? cargaTotal / tetoTotal * 100 : 0)}%</b></div>
    </div>

    <div class="larga"><table class="prem-tabela">${colunas}
      <thead>${cabGrupos}${cabCampos}</thead><tbody>${linhas}</tbody></table></div>

    <div class="colunas c-2" style="margin-top:16px;gap:26px">
      <p class="nota">O <b>alvo</b> é o que queremos, a <b>tolerância</b> é o quanto o cargo aceita ceder quando não há
        alternativa. O otimizador trabalha primeiro dentro do alvo e só usa a tolerância para não deixar cerimônia
        obrigatória sem janela, registrando cada concessão.</p>
      <p class="nota">As colunas calculadas seguem a fórmula: capacidade líquida = jornada × (1 − ausência) −
        institucional. Teto = <b>o menor</b> entre capacidade × (1 − alvo) e o máximo absoluto de horas por semana, e a
        marca <i>absoluto</i> aparece quando é o limite em horas que manda. Os tetos de dia, semana e mês são
        independentes, e o mensal é acumulado ao longo do horizonte.</p>
    </div>
  </section>

  <section class="sec">
    <div class="sec-cab"><h2>Demanda contra teto por cargo</h2><span class="apoio">tracejado marca o teto</span></div>
    <div style="max-width:620px">${barras(PAPEIS.map(pp => {
      const kps = k.porPessoa.filter(x => x.papel === pp);
      const m = kps.length ? kps.reduce((s, x) => s + x.horas, 0) / kps.length : 0;
      const teto = premDe(CFG, pp).teto;
      return { l: pp.split(' ')[0].slice(0, 8), v: m, ref: teto, t: n1(m) + 'h',
        cor: m > teto ? 'var(--destructive)' : 'var(--chart-1)' };
    }), { valores: true, dicas: true, h: 186, alt: 'carga contra teto por cargo' })}</div>
  </section>`;
}

function abaUrgencia() {
  const maxU = Math.max.apply(null, Object.keys(FASES).map(f => etapaDe(CFG, f).urgencia));
  return `<div class="colunas c-ab sec">
    <section>
      <div class="sec-cab"><h2>Etapas do ciclo</h2>
        <span class="apoio">urgência e prazo definem a ordem da fila
          <button class="btn" id="btnNovaEtapa">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
            Nova etapa</button></span></div>
      <table><thead><tr><th>Etapa</th><th class="n">Projetos</th>
        <th class="n">Urgência<div class="meta" style="text-transform:none;letter-spacing:0">1 a 5</div></th>
        <th class="n">Prazo<div class="meta" style="text-transform:none;letter-spacing:0">dias úteis</div></th>
        <th class="n">Cerimônias</th><th>Efeito no otimizador</th><th style="width:130px"></th></tr></thead><tbody>
        ${Object.entries(FASES).map(([f, v]) => { const et = etapaDe(CFG, f);
          const n = MUNDO.projetos.filter(p => p.fase === f).length;
          return `<tr><td>${seloFase(f)}</td><td class="n">${n}</td>
            <td class="edt"><input class="cel-edit" type="number" min="1" max="5" step="1" data-fase="${f}"
              data-campo-etapa="urgencia" value="${et.urgencia}" aria-label="Urgência de ${esc(v.rotulo)}"></td>
            <td class="edt"><input class="cel-edit" type="number" min="1" max="60" step="1" data-fase="${f}"
              data-campo-etapa="prazoDias" value="${et.prazoDias}" aria-label="Prazo de ${esc(v.rotulo)}"></td>
            <td class="n">${(PLAYBOOK[f] || []).length}</td>
            <td class="meta">${et.prazoDias <= 7 ? 'prazo crítico, puxada para o início da semana e da fila'
              : (et.urgencia >= 4 ? 'entra antes na fila de alocação' : 'cede lugar quando falta capacidade')}</td>
            <td><span class="acoes"><button class="mini-btn" data-edita-etapa="${f}">editar</button>
              ${Object.keys(FASES).length > 1 ? `<button class="mini-btn perigo" data-exclui-etapa="${f}">excluir</button>` : ''}</span></td></tr>`;
        }).join('')}
      </tbody></table>
      <p class="nota" style="margin-top:9px">Prazo de até 7 dias úteis marca a cerimônia como crítica: o solver a aloca
        primeiro, o mais cedo possível na semana, e uma cerimônia crítica adiada vira violação de SLA.</p>
    </section>
    <section>
      <div class="sec-cab"><h2>Prioridade do cliente</h2><span class="apoio">multiplica a urgência da etapa</span></div>
      <table><thead><tr><th>Prioridade</th><th class="n">Projetos</th><th class="n">Peso</th>
        <th class="n">Score da etapa mais urgente</th></tr></thead><tbody>
        ${['alta', 'media', 'baixa'].map(pri => {
          const n = MUNDO.projetos.filter(p => (p.prioridade || 'media') === pri).length;
          return `<tr><td>${selo(pri, pri === 'alta' ? 'acento' : 'neutro')}</td><td class="n">${n}</td>
            <td class="edt"><input class="cel-edit" type="number" min="1" max="5" step="1" data-prioridade="${pri}"
              value="${pesoCliente(CFG, pri)}" aria-label="Peso da prioridade ${pri}"></td>
            <td class="n calc">${n1(maxU * pesoCliente(CFG, pri))}</td></tr>`;
        }).join('')}
      </tbody></table>
      <p class="nota" style="margin-top:9px">Score = urgência da etapa × peso do cliente. É esse número que reordena a fila:
        um kickoff de cliente prioritário entra antes de um check-in de sustentação, mesmo que os dois caibam.</p>
      <p class="nota" style="margin-top:12px;padding:10px 13px;border:1px solid var(--accent);border-radius:var(--raio);background:var(--accent-wash);color:var(--accent-ink)">
        Com os valores atuais, <b>Kickoff</b> tem urgência ${etapaDe(CFG, 'kickoff').urgencia} e prazo de
        ${etapaDe(CFG, 'kickoff').prazoDias} dias úteis do fechamento do contrato: score
        ${n1(etapaDe(CFG, 'kickoff').urgencia * pesoCliente(CFG, 'alta'))} num cliente de prioridade alta, contra
        ${n1(etapaDe(CFG, 'sustentacao').urgencia * pesoCliente(CFG, 'baixa'))} de um check-in de sustentação.</p>
    </section>
  </div>`;
}

function abaPlaybook() {
  const F = 4.33 / CFG.horizonte, uso = {};
  SIM.semanas.forEach(sm => doCenario(sm).alocadas.forEach(ev => {
    const chave = ev.fase + '|' + ev.tipo;
    uso[chave] = uso[chave] || { cer: 0, h: 0 };
    uso[chave].cer += F; uso[chave].h += ev.dur / 60 * ev.participantes.length * F;
  }));
  const total = Object.values(uso).reduce((s, x) => s + x.h, 0) || 1;
  const CADENCIAS = [1, 2, 3, 4, 6, 8, 12];

  return `<section class="sec">
    <div class="sec-cab"><h2>Playbook de cerimônias</h2>
      <span class="apoio">a demanda de agenda nasce daqui
        <button class="mini-btn" id="btnRestaurarPlaybook">Restaurar padrão</button>
        <button class="btn" id="btnNovaCerimonia">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
          Nova cerimônia</button></span></div>
    <p class="nota" style="margin-bottom:10px">Duração, recorrência e obrigatoriedade são editáveis na própria linha.
      Mudar a recorrência de uma etapa muda a demanda de todos os projetos naquela etapa, então o cenário é replanejado
      a cada alteração.</p>
    <div class="larga"><table style="min-width:1120px"><thead><tr>
      <th>Etapa</th><th class="n">Projetos</th><th>Cerimônia</th><th>Cargos obrigatórios</th>
      <th class="n">Duração<div class="meta" style="text-transform:none;letter-spacing:0">min</div></th>
      <th>Recorrência</th><th class="n">Prioridade</th><th>Tipo</th>
      <th class="n">Cerim./mês</th><th class="n">Pessoa-hora/mês</th><th style="width:140px">Peso na agenda</th>
      <th style="width:90px"></th>
    </tr></thead><tbody>
      ${Object.entries(PLAYBOOK).map(([f, cs]) => {
        const nproj = MUNDO.projetos.filter(p => p.fase === f).length, et = etapaDe(CFG, f);
        return cs.map((c, i) => {
          const u = uso[f + '|' + c.tipo] || { cer: 0, h: 0 };
          return `<tr>
            <td>${i === 0 ? seloFase(f) + `<div class="meta">urgência ${et.urgencia}, prazo ${et.prazoDias}d</div>` : ''}</td>
            <td class="n">${i === 0 ? nproj : ''}</td>
            <td><b>${esc(c.tipo)}</b></td>
            <td><button class="mini-btn" data-edita-cer="${f}|${i}" style="font-weight:400">${esc(c.papeis.join(' + '))}</button></td>
            <td class="edt"><input class="cel-edit" type="number" min="15" max="240" step="15" value="${c.dur}"
              data-cer-fase="${f}" data-cer-idx="${i}" data-cer-campo="dur" aria-label="Duração de ${esc(c.tipo)}"></td>
            <td class="edt"><select class="cel-edit" style="width:132px;text-align:left"
              data-cer-fase="${f}" data-cer-idx="${i}" data-cer-campo="cada" aria-label="Recorrência de ${esc(c.tipo)}">
              ${CADENCIAS.map(v => `<option value="${v}" ${c.cada === v ? 'selected' : ''}>${v === 1 ? 'semanal' : 'a cada ' + v + ' sem'}</option>`).join('')}</select></td>
            <td class="edt"><select class="cel-edit" style="width:52px"
              data-cer-fase="${f}" data-cer-idx="${i}" data-cer-campo="prio" aria-label="Prioridade de ${esc(c.tipo)}">
              ${[1, 2, 3, 4, 5].map(v => `<option value="${v}" ${c.prio === v ? 'selected' : ''}>${v}</option>`).join('')}</select></td>
            <td class="edt"><select class="cel-edit" style="width:104px;text-align:left"
              data-cer-fase="${f}" data-cer-idx="${i}" data-cer-campo="obrig" aria-label="Tipo de ${esc(c.tipo)}">
              <option value="1" ${c.obrig ? 'selected' : ''}>obrigatória</option>
              <option value="0" ${c.obrig ? '' : 'selected'}>opcional</option></select></td>
            <td class="n">${n0(u.cer)}</td><td class="n">${n1(u.h)}</td>
            <td>${trilha(u.h, total)}<div class="meta">${n1(u.h / total * 100)}%</div></td>
            <td><span class="acoes"><button class="mini-btn perigo" data-exclui-cer="${f}|${i}">excluir</button></span></td>
          </tr>`;
        }).join('');
      }).join('')}
    </tbody></table></div>
    <p class="nota" style="margin-top:9px">Cerimônias e pessoa-hora por mês vêm do cenário
      ${UI.cenario === 'otm' ? 'otimizado' : 'vigente'}, projetados do horizonte de ${CFG.horizonte} semanas.
      A prioridade é a ordem base na fila, corrigida pela urgência da etapa e pelo peso do cliente.</p>
  </section>`;
}

/* ---------- indicadores ---------- */
function telaIndicadores() {
  const mes = SIM.mes[UI.cenario], mb = SIM.mes.base, mo = SIM.mes.otm;
  const k = doCenario(semana1()).kpi;
  const cmp = UI.cenario === 'otm';

  const porPapel = PAPEIS.map(pp => {
    const ps = k.porPessoa.filter(x => x.papel === pp);
    if (!ps.length) return null;
    return {
      pp, n: ps.length,
      rMes: ps.reduce((s, x) => s + mes.porPessoa[x.id].reunioes, 0),
      hMes: ps.reduce((s, x) => s + mes.porPessoa[x.id].horas, 0),
      taxa: ps.reduce((s, x) => s + x.taxa, 0) / ps.length,
      teto: ps[0].tetoPct
    };
  }).filter(Boolean);

  return faixa([
    indicador('Reuniões no mês', String(mes.reunioes), { delta: cmp ? delta(mb.reunioes, mo.reunioes, true, '') : undefined }),
    indicador('Pessoa-hora no mês', n0(mes.horas) + 'h', { delta: cmp ? delta(mb.horas, mo.horas, true, 'h') : undefined }),
    indicador('Reuniões por pessoa', n1(mes.porPessoa.reduce((s, x) => s + x.reunioes, 0) / MUNDO.pessoas.length)),
    indicador('Horas por pessoa', n1(mes.horas / MUNDO.pessoas.length) + 'h'),
    indicador('Tempo produtivo médio', pc(mes.produtivo), {
      tom: mes.produtivo >= k.alvoMedio ? 'bom' : 'ruim',
      delta: cmp ? delta(mb.produtivo, mo.produtivo, false, ' p.p.') : undefined }),
    indicador('Custo de cerimônia', 'R$ ' + n0(mes.horas * 118 / 1000) + 'k')
  ]) + `
  <div class="colunas c-2 sec">
    <section><div class="sec-cab"><h2>Cerimônias por semana</h2>
      <span class="apoio">horizonte de ${CFG.horizonte} semanas</span></div>
      ${barras(SIM.semanas.map((w, i) => ({ l: 'S' + (i + 1), v: doCenario(w).alocadas.length, t: String(doCenario(w).alocadas.length) })),
        { valores: true, dicas: true, eixoY: false, alt: 'cerimônias por semana' })}</section>
    <section><div class="sec-cab"><h2>Pessoa-hora por semana</h2><span class="apoio">carga total do time</span></div>
      ${barras(SIM.semanas.map((w, i) => ({ l: 'S' + (i + 1), v: doCenario(w).kpi.horasTotais,
        t: n0(doCenario(w).kpi.horasTotais) + 'h', cor: 'var(--chart-2)' })), { valores: true, dicas: true, eixoY: false, alt: 'horas por semana' })}</section>
  </div>

  <section class="sec">
    <div class="sec-cab"><h2>Quadro de pessoal</h2>
      <span class="apoio">precisamos de mais gente, e de qual cargo</span></div>
    <p class="nota" style="margin-bottom:12px">A demanda vem do playbook e conta inclusive as cerimônias que hoje não
      acontecem por falta de quórum, porque justamente essas são o sintoma da falta de gente. A capacidade é o teto de
      reunião do cargo multiplicado por quantas pessoas o ocupam.</p>
    <div class="larga"><table style="min-width:980px"><thead><tr>
      <th>Cargo</th><th class="n">Pessoas</th><th class="n">Teto por pessoa</th><th class="n">Capacidade</th>
      <th class="n">Demanda</th><th class="n">Sem quórum</th><th style="width:150px">Ocupação</th>
      <th class="n">Saldo</th><th>Situação</th><th>Recomendação</th>
    </tr></thead><tbody>
      ${analiseCapacidade(MUNDO, CFG, CFG.horizonte).map(r => {
        const tom = r.situacao === 'falta gente' || r.situacao === 'sem ninguém' ? 'ruim'
          : r.situacao === 'no limite' ? 'aviso' : r.situacao === 'folga' ? 'neutro' : 'ok';
        const ocup = isFinite(r.ocupacao) ? r.ocupacao : 200;
        return `<tr>
          <td><b>${esc(r.papel)}</b></td>
          <td class="n">${r.pessoas}</td><td class="n">${n1(r.teto)}h</td><td class="n">${n1(r.capacidade)}h</td>
          <td class="n">${n1(r.demanda)}h</td>
          <td class="n" style="color:var(--${r.semQuorum > 0 ? 'bad' : 'ink'})">${r.semQuorum > 0 ? n1(r.semQuorum) + 'h' : '0,0h'}</td>
          <td>${trilha(Math.min(ocup, 100), 100, 100, ocup > 100 ? 'ruim' : (ocup > 88 ? '' : 'ok'))}
            <div class="meta">${isFinite(r.ocupacao) ? n0(r.ocupacao) + '% da capacidade' : 'sem capacidade'}</div></td>
          <td class="n" style="color:var(--${r.saldoFte < -0.25 ? 'bad' : 'ink'})">${r.saldoFte > 0 ? '+' : ''}${n1(r.saldoFte)} FTE</td>
          <td>${selo(r.situacao, tom)}</td>
          <td class="meta">${esc(r.acao)}</td></tr>`;
      }).join('')}
    </tbody></table></div>
  </section>

  <section class="sec">
    <div class="sec-cab"><h2>Capacidade por time</h2><span class="apoio">carga contra o teto somado dos membros</span></div>
    <table><thead><tr><th>Time</th><th class="n">Pessoas</th><th class="n">Projetos</th><th class="n">Capacidade</th>
      <th class="n">Carga</th><th style="width:160px">Ocupação</th><th>Cargos ausentes</th><th>Leitura</th></tr></thead><tbody>
      ${MUNDO.times.map(t => {
        const membros = membrosDoTime(MUNDO, t.id);
        const projs = projetosDoTime(MUNDO, t.id);
        const capac = membros.reduce((s, id) => s + premDe(CFG, MUNDO.pessoas[id].papel).teto, 0);
        const carga = membros.reduce((s, id) => s + k.porPessoa[id].horas, 0);
        const ocup = capac > 0 ? carga / capac * 100 : 0;
        const comp = cargosDoTime(MUNDO, t.id);
        const faltando = [...new Set(projs.flatMap(p => papeisNecessarios(p.fase)))].filter(pp => !comp[pp]);
        const leitura = faltando.length ? selo('cobertura incompleta', 'ruim')
          : ocup > 88 ? selo('sem folga', 'aviso') : ocup < 45 ? selo('cabe mais projeto', 'neutro') : selo('equilibrado', 'ok');
        return `<tr><td><b>${esc(t.nome)}</b></td><td class="n">${membros.length}</td><td class="n">${projs.length}</td>
          <td class="n">${n1(capac)}h</td><td class="n">${n1(carga)}h</td>
          <td>${trilha(Math.min(ocup, 100), 100, 100, ocup > 100 ? 'ruim' : (ocup > 88 ? '' : 'ok'))}
            <div class="meta">${n0(ocup)}%</div></td>
          <td>${faltando.length ? esc(faltando.join(', ')) : '<span class="meta">nenhum</span>'}</td>
          <td>${leitura}</td></tr>`;
      }).join('')}
    </tbody></table>
  </section>

  <div class="colunas c-2 sec">
    <section><div class="sec-cab"><h2>Taxa de reunião por cargo</h2><span class="apoio">tracejado marca o teto do cargo</span></div>
      ${barras(porPapel.map(x => ({ l: x.pp.split(' ')[0].slice(0, 8), v: x.taxa, ref: x.teto, t: n1(x.taxa) + '%',
        cor: x.taxa > x.teto ? 'var(--destructive)' : 'var(--chart-1)' })), { valores: true, dicas: true, alt: 'taxa por cargo' })}</section>
    <section>
      <div class="sec-cab"><h2>Consolidado mensal por cargo</h2>
        <span class="apoio">${UI.cenario === 'otm' ? 'cenário otimizado' : 'agenda atual'}</span></div>
      <table><thead><tr><th>Cargo</th><th class="n">Pessoas</th><th class="n">Reuniões</th><th class="n">Horas</th>
        <th class="n">Média por pessoa</th><th class="n">Taxa</th><th class="n">Teto</th></tr></thead><tbody>
        ${porPapel.map(x => `<tr><td>${esc(x.pp)}</td><td class="n">${x.n}</td><td class="n">${x.rMes}</td>
          <td class="n">${n1(x.hMes)}</td><td class="n">${n1(x.hMes / x.n)}h</td>
          <td class="n" style="color:var(--${x.taxa > x.teto ? 'bad' : 'ink'})">${n1(x.taxa)}%</td>
          <td class="n calc">${x.teto}%</td></tr>`).join('')}
      </tbody></table>
      <p class="nota" style="margin-top:9px">Custo estimado a R$ 118 por hora-pessoa. As reuniões mensais são projetadas
        a partir do horizonte simulado.</p>
    </section>
  </div>`;
}

/* ───────────────────────── §5 EDITORES EM LINHA ───────────────────────── */
let RASCUNHO = {};

function editorProjeto(pr) {
  if (!RASCUNHO.tipo || RASCUNHO.id !== (pr ? pr.id : null) || RASCUNHO.tipo !== 'projeto') {
    RASCUNHO = { tipo: 'projeto', id: pr ? pr.id : null,
      nome: pr ? pr.nome : '', fase: pr ? pr.fase : 'kickoff', mes: pr ? pr.mes : 1,
      health: pr ? pr.health : 'verde', prioridade: pr ? (pr.prioridade || 'media') : 'media',
    timeId: pr ? pr.timeId : (MUNDO.times[0] ? MUNDO.times[0].id : 0),
      rel: pr ? pr.produtos.relatorios : 3, dash: pr ? pr.produtos.dashboards : 2,
      integ: pr ? pr.produtos.integracoes : 1, squad: pr ? Object.assign({}, pr.squad) : {}, erro: '' };
  }
  const d = RASCUNHO, nec = papeisNecessarios(d.fase), et = etapaDe(CFG, d.fase);
  return `<div class="editor abre" data-editor="projeto">
    <div class="editor-cab"><h3>${pr ? 'Editar ' + esc(pr.nome) : 'Novo projeto'}</h3>
      <span class="meta">Etapa ${FASES[d.fase].rotulo}: urgência ${et.urgencia} de 5, prazo de ${et.prazoDias} dias úteis.</span></div>
    <div class="form">
      <div class="campo l2"><label for="epNome">Cliente e projeto</label>
        <input type="text" id="epNome" value="${esc(d.nome)}" placeholder="Grupo Aurora A"></div>
      <div class="campo"><label for="epFase">Fase</label><select id="epFase">
        ${Object.entries(FASES).map(([k2, v]) => `<option value="${k2}" ${d.fase === k2 ? 'selected' : ''}>${v.rotulo}</option>`).join('')}</select></div>
      <div class="campo"><label for="epMes">Mês do projeto</label>
        <input type="number" id="epMes" min="1" max="48" value="${d.mes}"></div>
      <div class="campo"><label for="epRel">Relatórios</label><input type="number" id="epRel" min="0" max="40" value="${d.rel}"></div>
      <div class="campo"><label for="epDash">Dashboards</label><input type="number" id="epDash" min="0" max="40" value="${d.dash}"></div>
      <div class="campo"><label for="epInteg">Integrações</label><input type="number" id="epInteg" min="0" max="20" value="${d.integ}"></div>
      <div class="campo"><label for="epHealth">Health</label><select id="epHealth">
        ${['verde', 'amarelo', 'vermelho'].map(h => `<option value="${h}" ${d.health === h ? 'selected' : ''}>${h}</option>`).join('')}</select></div>
      <div class="campo l2"><label for="epTime">Time responsável</label><select id="epTime">
        ${MUNDO.times.map(t => `<option value="${t.id}" ${estado.timeId === t.id ? 'selected' : ''}>${esc(t.nome)}, ${membrosDoTime(MUNDO, t.id).length} pessoas</option>`).join('')}</select>
        <span class="dica">O squad sai dos membros deste time. Trocar o time refaz as cadeiras.</span></div>
      <div class="campo l2"><label for="epPrioridade">Prioridade do cliente</label><select id="epPrioridade">
        ${['alta', 'media', 'baixa'].map(h => `<option value="${h}" ${d.prioridade === h ? 'selected' : ''}>${h}, peso ${pesoCliente(CFG, h)}</option>`).join('')}</select>
        <span class="dica">Urgência da etapa vezes peso do cliente define a posição na fila do otimizador.</span></div>
      <div class="l4"><div class="sec-cab" style="margin-bottom:10px"><h2>Squad</h2>
        <span class="apoio">cargos exigidos pela fase ${FASES[d.fase].rotulo}, deixar em automático distribui pela menor carga</span></div>
        <div class="form">
          ${nec.map(pp => {
            const cand = MUNDO.pessoas.filter(x => x.papel === pp);
            return `<div class="campo"><label for="eq-${esc(pp)}">${esc(pp)}</label>
              <select id="eq-${esc(pp)}" class="squad-sel" data-papel="${esc(pp)}">
                <option value="">automático</option>
                ${cand.map(c => `<option value="${c.id}" ${d.squad[pp] === c.id ? 'selected' : ''}>${esc(c.nome)}</option>`).join('')}
              </select>${cand.length ? '' : '<span class="erro">nenhuma pessoa com este cargo, a cerimônia ficará sem quórum</span>'}</div>`;
          }).join('')}
        </div></div>
    </div>
    <div class="editor-pe">${d.erro ? `<span class="msg">${esc(d.erro)}</span>` : ''}
      <button class="mini-btn" data-cancela-editor="1">Cancelar</button>
      <button class="btn" id="btnSalvarProjeto">Salvar projeto</button></div>
  </div>`;
}

function editorPessoa(p) {
  if (RASCUNHO.tipo !== 'pessoa' || RASCUNHO.id !== (p ? p.id : null)) {
    RASCUNHO = { tipo: 'pessoa', id: p ? p.id : null, nome: p ? p.nome : '',
      papel: p ? p.papel : PAPEIS[0], erro: '' };
  }
  const d = RASCUNHO;
  const projs = p ? MUNDO.projetos.filter(pr => Object.values(pr.squad).indexOf(p.id) >= 0) : [];
  return `<div class="editor abre" data-editor="pessoa">
    <div class="editor-cab"><h3>${p ? 'Editar ' + esc(p.nome) : 'Nova pessoa'}</h3>
      ${p ? `<span class="meta">${projs.length} projeto(s) alocados</span>` : ''}</div>
    <div class="form">
      <div class="campo l2"><label for="ezNome">Nome</label>
        <input type="text" id="ezNome" value="${esc(d.nome)}" placeholder="Nome e sobrenome"></div>
      <div class="campo l2"><label for="ezPapel">Cargo</label><select id="ezPapel">
        ${PAPEIS.map(pp => { const c = premDe(CFG, pp);
          return `<option value="${esc(pp)}" ${d.papel === pp ? 'selected' : ''}>${esc(pp)}, alvo ${c.produtivoMin}%, teto ${n1(c.teto)}h</option>`; }).join('')}</select>
        <span class="dica">O cargo define todas as restrições de agenda dessa pessoa. Trocar o cargo libera as cadeiras
          atuais e reatribui os projetos.</span></div>
      ${p && projs.length ? `<div class="l4"><span class="meta">Alocação atual: ${esc(projs.slice(0, 12).map(x => x.nome).join(', '))}${projs.length > 12 ? ' e outros' : ''}</span></div>` : ''}
    </div>
    <div class="editor-pe">${d.erro ? `<span class="msg">${esc(d.erro)}</span>` : ''}
      <button class="mini-btn" data-cancela-editor="1">Cancelar</button>
      <button class="btn" id="btnSalvarPessoa">Salvar pessoa</button></div>
  </div>`;
}

function editorCargo(cargo) {
  if (RASCUNHO.tipo !== 'cargo' || RASCUNHO.id !== (cargo || null)) {
    RASCUNHO = { tipo: 'cargo', id: cargo || null, nome: cargo || '', base: PAPEIS[0], erro: '' };
  }
  const d = RASCUNHO;
  return `<div class="editor abre" data-editor="cargo">
    <div class="editor-cab"><h3>${cargo ? 'Renomear ' + esc(cargo) : 'Novo cargo'}</h3>
      ${cargo ? `<span class="meta">${pessoasDo(cargo).length} pessoa(s) e ${cargoEmUso(MUNDO, cargo).cerimonias} cerimônia(s) acompanham a mudança</span>` : ''}</div>
    <div class="form">
      <div class="campo l2"><label for="ecNome">Nome do cargo</label>
        <input type="text" id="ecNome" value="${esc(d.nome)}" placeholder="Consultor de Implantação"></div>
      ${cargo ? '' : `<div class="campo l2"><label for="ecBase">Copiar premissas de</label><select id="ecBase">
        ${PAPEIS.map(pp => `<option value="${esc(pp)}" ${d.base === pp ? 'selected' : ''}>${esc(pp)}</option>`).join('')}</select>
        <span class="dica">Os valores podem ser ajustados em Premissas. O cargo só gera demanda quando aparecer no
          playbook de alguma cerimônia.</span></div>`}
    </div>
    <div class="editor-pe">${d.erro ? `<span class="msg">${esc(d.erro)}</span>` : ''}
      <button class="mini-btn" data-cancela-editor="1">Cancelar</button>
      <button class="btn" id="btnSalvarCargo">${cargo ? 'Renomear' : 'Criar cargo'}</button></div>
  </div>`;
}

function editorTime(id) {
  const t = id !== null && id !== undefined ? MUNDO.times.find(x => x.id === id) : null;
  if (RASCUNHO.tipo !== 'time' || RASCUNHO.id !== (t ? t.id : null)) {
    RASCUNHO = { tipo: 'time', id: t ? t.id : null, nome: t ? t.nome : '',
      membros: t ? t.membros.slice() : [], erro: '' };
  }
  const d = RASCUNHO;
  const porPapel = {};
  MUNDO.pessoas.forEach(p => { (porPapel[p.papel] = porPapel[p.papel] || []).push(p); });
  const projs = t ? projetosDoTime(MUNDO, t.id) : [];
  const exigidos = [...new Set(projs.flatMap(p => papeisNecessarios(p.fase)))];
  const cobertos = {};
  d.membros.forEach(id2 => { if (MUNDO.pessoas[id2]) cobertos[MUNDO.pessoas[id2].papel] = true; });
  const faltando = exigidos.filter(pp => !cobertos[pp]);

  return `<div class="editor" data-editor="time">
    <div class="editor-cab"><h3>${t ? 'Editar ' + esc(t.nome) : 'Novo time'}</h3>
      ${t ? `<span class="meta">${projs.length} projeto(s) neste time</span>` : ''}</div>
    <div class="form">
      <div class="campo l4"><label for="etNome">Nome do time</label>
        <input type="text" id="etNome" value="${esc(d.nome)}" placeholder="Squad Echo"></div>
      <div class="campo l4"><label>Membros</label>
        <span class="dica" style="margin-bottom:6px">Uma pessoa pode estar em mais de um time, o que é o caso dos cargos
          escassos. O squad de cada projeto sai daqui.</span>
        ${Object.entries(porPapel).map(([pp, lista]) => `<div style="margin-bottom:9px">
          <div class="meta" style="margin-bottom:5px">${esc(pp)}</div>
          <div style="display:flex;flex-wrap:wrap;gap:6px">
            ${lista.map(p => `<button type="button" class="slot" style="padding:5px 11px"
              data-membro="${p.id}" aria-pressed="${d.membros.indexOf(p.id) >= 0}">${esc(primeiro(p.nome))}</button>`).join('')}
          </div></div>`).join('')}
      </div>
      ${faltando.length ? `<div class="l4"><div class="aviso" role="alert" style="margin:0">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" aria-hidden="true">
          <path d="M12 9v4M12 17h.01M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/></svg>
        <b>Sem cobertura para ${esc(faltando.join(', '))}</b>
        <p>As cerimônias que exigem esses cargos ficarão sem quórum nos projetos deste time.</p></div></div>` : ''}
    </div>
    <div class="editor-pe">${d.erro ? `<span class="msg">${esc(d.erro)}</span>` : ''}
      <button class="mini-btn" data-cancela-editor="1">Cancelar</button>
      <button class="btn" id="btnSalvarTime">${t ? 'Salvar time' : 'Criar time'}</button></div>
  </div>`;
}

function editorCerimonia(ref) {
  const edicao = typeof ref === 'string' && ref.indexOf('|') >= 0;
  const atual = edicao ? PLAYBOOK[ref.split('|')[0]][+ref.split('|')[1]] : null;
  if (RASCUNHO.tipo !== 'cerimonia' || RASCUNHO.id !== (edicao ? ref : null)) {
    RASCUNHO = atual
      ? { tipo: 'cerimonia', id: ref, fase: ref.split('|')[0], nomeCer: atual.tipo, dur: atual.dur,
          cada: atual.cada, obrig: atual.obrig, prio: atual.prio, papeis: atual.papeis.slice(), erro: '' }
      : { tipo: 'cerimonia', id: null, fase: (typeof ref === 'string' ? ref : null) || Object.keys(FASES)[0],
          nomeCer: '', dur: 60, cada: 1, obrig: true, prio: 3, papeis: [], erro: '' };
  }
  const d = RASCUNHO;
  return `<div class="editor" data-editor="cerimonia">
    <div class="editor-cab"><h3>${edicao ? 'Editar ' + esc(atual.tipo) : 'Nova cerimônia'}</h3>
      <span class="meta">${edicao ? 'vale para os ' + MUNDO.projetos.filter(p => p.fase === d.fase).length + ' projeto(s) da etapa'
        : 'a série passa a valer para todos os projetos da etapa escolhida'}</span></div>
    <div class="form">
      <div class="campo l2"><label for="ekNome">Nome da cerimônia</label>
        <input type="text" id="ekNome" value="${esc(d.nomeCer)}" placeholder="Revisão de Escopo"></div>
      <div class="campo"><label for="ekFase">Etapa</label><select id="ekFase" ${edicao ? 'disabled' : ''}>
        ${Object.entries(FASES).map(([k2, v]) => `<option value="${k2}" ${d.fase === k2 ? 'selected' : ''}>${v.rotulo}</option>`).join('')}</select></div>
      <div class="campo"><label for="ekDur">Duração em minutos</label>
        <input type="number" id="ekDur" min="15" max="240" step="15" value="${d.dur}"></div>
      <div class="campo"><label for="ekCada">Recorrência</label><select id="ekCada">
        ${[1, 2, 3, 4, 6, 8, 12].map(v => `<option value="${v}" ${d.cada === v ? 'selected' : ''}>${v === 1 ? 'semanal' : 'a cada ' + v + ' semanas'}</option>`).join('')}</select></div>
      <div class="campo"><label for="ekObrig">Tipo</label><select id="ekObrig">
        <option value="1" ${d.obrig ? 'selected' : ''}>obrigatória</option>
        <option value="0" ${d.obrig ? '' : 'selected'}>opcional</option></select></div>
      <div class="campo"><label for="ekPrio">Prioridade na fila</label><select id="ekPrio">
        ${[1, 2, 3, 4, 5].map(v => `<option value="${v}" ${d.prio === v ? 'selected' : ''}>${v}${v === 1 ? ', mais alta' : (v === 5 ? ', mais baixa' : '')}</option>`).join('')}</select></div>
      <div class="campo l4"><label>Cargos obrigatórios</label>
        <div style="display:flex;flex-wrap:wrap;gap:7px">
          ${PAPEIS.map(pp => {
            const n = MUNDO.times.filter(t => membrosDoTime(MUNDO, t.id).some(id => MUNDO.pessoas[id].papel === pp)).length;
            return `<button type="button" class="slot" style="padding:5px 11px" data-papel-cer="${esc(pp)}"
              aria-pressed="${d.papeis.indexOf(pp) >= 0}"
              data-dica="${esc(pp)}: presente em ${n} de ${MUNDO.times.length} times">${esc(pp)}</button>`;
          }).join('')}</div>
        <span class="dica">Define quem é obrigatório nesta reunião. Se um time não tiver o cargo, os projetos dele
          perdem esta cerimônia por falta de quórum.</span></div>
    </div>
    <div class="editor-pe">${d.erro ? `<span class="msg">${esc(d.erro)}</span>` : ''}
      <button class="mini-btn" data-cancela-editor="1">Cancelar</button>
      <button class="btn" id="btnSalvarCerimonia">${edicao ? 'Salvar cerimônia' : 'Criar cerimônia'}</button></div>
  </div>`;
}

/* ───────────────────────── §5b MODAIS ───────────────────────── */
const BOTAO_FECHAR = `<button class="fechar-x" data-cancela-editor="1" aria-label="Fechar">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" aria-hidden="true">
    <path d="M18 6 6 18M6 6l12 12"/></svg></button>`;

function conteudoEditor() {
  const e = UI.editando;
  if (!e) return null;
  if (e.tipo === 'projeto') return { largura: 760, html: editorProjeto(e.id === null ? null : MUNDO.projetos.find(x => x.id === e.id)) };
  if (e.tipo === 'pessoa') return { largura: 560, html: editorPessoa(e.id === null ? null : MUNDO.pessoas[e.id]) };
  if (e.tipo === 'cargo') return { largura: 520, html: editorCargo(e.id) };
  if (e.tipo === 'cerimonia') return { largura: 720, html: editorCerimonia(e.id || e.fase || null) };
  if (e.tipo === 'time') return { largura: 680, html: editorTime(e.id) };
  if (e.tipo === 'etapa') return { largura: 520, html: editorEtapa(e.id) };
  return null;
}

function conteudoConfirmacao() {
  const c = UI.confirmando;
  if (!c) return null;
  if (c.tipo === 'projeto') {
    const p = MUNDO.projetos.find(x => x.id === c.id);
    if (!p) return null;
    return { titulo: `Excluir ${p.nome}?`, acao: 'Excluir projeto',
      texto: `As cerimônias desse projeto saem do plano e a capacidade do squad é liberada.
        Hoje ele consome ${p.produtos.relatorios + p.produtos.dashboards + p.produtos.integracoes} produtos em ${FASES[p.fase] ? FASES[p.fase].rotulo : 'etapa removida'}.` };
  }
  if (c.tipo === 'pessoa') {
    const p = MUNDO.pessoas[c.id];
    if (!p) return null;
    const projs = MUNDO.projetos.filter(pr => Object.values(pr.squad).indexOf(p.id) >= 0).length;
    const outros = MUNDO.pessoas.filter(x => x.papel === p.papel && x.id !== p.id).length;
    return { titulo: `Remover ${p.nome} do time?`, acao: 'Remover pessoa',
      texto: `${projs} projeto(s) serão reatribuídos ` + (outros
        ? `a outra(s) ${outros} pessoa(s) de ${p.papel}, pela menor carga.`
        : `sem substituto: não há outro ${p.papel}, então essas cerimônias ficarão sem quórum.`) };
  }
  if (c.tipo === 'cargo') {
    const uso = cargoEmUso(MUNDO, c.id);
    return { titulo: `Excluir o cargo ${c.id}?`, acao: 'Excluir cargo',
      texto: uso.cerimonias ? `${uso.cerimonias} tipo(s) de cerimônia do playbook exigem ${c.id} e ficarão sem quórum.`
        : `Nenhuma cerimônia do playbook depende de ${c.id}.` };
  }
  if (c.tipo === 'cerimonia') {
    const [f, i] = c.id.split('|');
    const cer = PLAYBOOK[f] && PLAYBOOK[f][+i];
    if (!cer) return null;
    return { titulo: `Remover ${cer.tipo} do playbook?`, acao: 'Remover cerimônia',
      texto: `A série deixa de ser gerada para os ${MUNDO.projetos.filter(p => p.fase === f).length} projeto(s) em
        ${FASES[f].rotulo}. O cenário é replanejado em seguida.` };
  }
  if (c.tipo === 'redistribuir') {
    return { titulo: 'Redistribuir a alocação do time?', acao: 'Redistribuir', perigo: false,
      texto: `Todas as cadeiras dos ${MUNDO.projetos.length} projetos são refeitas pela menor carga de cada cargo.
        Serve para absorver entradas e saídas no time. A agenda inteira é replanejada em seguida.` };
  }
  if (c.tipo === 'time') {
    const t = MUNDO.times.find(x => x.id === c.id);
    const n = projetosDoTime(MUNDO, c.id).length;
    const destinos = MUNDO.times.filter(x => x.id !== c.id);
    return { titulo: `Excluir ${t.nome}?`, acao: 'Excluir time',
      texto: n ? `${n} projeto(s) pertencem a este time e precisam de destino. Os squads deles serão remontados
        com os membros do time escolhido.` : 'Nenhum projeto pertence a este time.',
      extra: n ? `<div class="campo" style="margin-top:14px"><label for="destinoTime">Mover os projetos para</label>
        <select id="destinoTime">${destinos.map(x => `<option value="${x.id}">${esc(x.nome)}</option>`).join('')}</select></div>` : '' };
  }
  if (c.tipo === 'etapa') {
    const n = projetosNaEtapa(MUNDO, c.id);
    const destinos = Object.keys(FASES).filter(f => f !== c.id);
    return { titulo: `Remover a etapa ${FASES[c.id].rotulo}?`, acao: 'Remover etapa',
      texto: n ? `${n} projeto(s) estão nesta etapa e precisam de destino. O playbook da etapa,
        com ${(PLAYBOOK[c.id] || []).length} cerimônia(s), é descartado.`
        : `Nenhum projeto está nesta etapa. O playbook dela, com ${(PLAYBOOK[c.id] || []).length} cerimônia(s), é descartado.`,
      extra: n ? `<div class="campo" style="margin-top:14px"><label for="destinoEtapa">Mover os projetos para</label>
        <select id="destinoEtapa">${destinos.map(f => `<option value="${f}">${esc(FASES[f].rotulo)}</option>`).join('')}</select></div>` : '' };
  }
  return null;
}

function renderizarModais() {
  const alvo = document.getElementById('modais');
  const ed = conteudoEditor();
  const cf = ed ? null : conteudoConfirmacao();
  if (!ed && !cf) { alvo.innerHTML = ''; document.body.classList.remove('travado'); return; }
  document.body.classList.add('travado');
  if (ed) {
    alvo.innerHTML = `<div class="fundo" data-fecha-modal="1"><div class="caixa" role="dialog" aria-modal="true"
      style="max-width:${ed.largura}px">${BOTAO_FECHAR}${ed.html}</div></div>`;
  } else {
    alvo.innerHTML = `<div class="fundo" data-fecha-modal="1"><div class="caixa" role="dialog" aria-modal="true"
      style="max-width:520px">${BOTAO_FECHAR}<div class="editor">
      <div class="editor-cab"><h3>${esc(cf.titulo)}</h3></div>
      <p class="nota">${cf.texto}</p>${cf.extra || ''}
      <div class="editor-pe"><button class="mini-btn" data-cancela-confirma="1">Cancelar</button>
        <button class="btn ${cf.perigo === false ? '' : 'perigo'}" id="btnConfirmarAcao">${esc(cf.acao)}</button></div>
    </div></div></div>`;
  }
  ligarModal();
  const foco = alvo.querySelector('input, select, button.btn');
  if (foco) foco.focus();
}

function fecharModal() {
  UI.editando = null; UI.confirmando = null; RASCUNHO = {};
  document.getElementById('modais').innerHTML = '';
  document.body.classList.remove('travado');
}

function ligarModal() {
  const raiz = document.getElementById('modais');
  raiz.querySelectorAll('.fechar-x').forEach(el => el.addEventListener('click', fecharModal));
  raiz.querySelectorAll('[data-fecha-modal]').forEach(el => el.addEventListener('mousedown', ev => {
    if (ev.target === el) fecharModal();
  }));
  const ok = document.getElementById('btnConfirmarAcao');
  if (ok) ok.addEventListener('click', executarConfirmacao);
  ligar();
}

function executarConfirmacao() {
  const c = UI.confirmando;
  if (!c) return;
  if (c.tipo === 'projeto') { excluirProjeto(MUNDO, c.id); fecharModal(); recalcular('projeto excluído, cenário replanejado'); return; }
  if (c.tipo === 'pessoa') {
    excluirPessoa(MUNDO, c.id);
    UI.pessoas = UI.pessoas.filter(x => x < MUNDO.pessoas.length);
    fecharModal(); recalcular('pessoa removida, cadeiras reatribuídas'); return;
  }
  if (c.tipo === 'cargo') { delete PREM[c.id]; fecharModal(); recalcular('cargo excluído'); return; }
  if (c.tipo === 'cerimonia') {
    const [f, i] = c.id.split('|');
    removerCerimonia(f, +i);
    MUNDO.projetos.forEach(pr => montarSquad(MUNDO, pr));
    fecharModal(); recalcular('cerimônia removida do playbook'); return;
  }
  if (c.tipo === 'redistribuir') { rebalancearAlocacao(MUNDO); fecharModal(); recalcular('alocação redistribuída'); return; }
  if (c.tipo === 'time') {
    const t = MUNDO.times.find(x => x.id === c.id);
    const n = projetosDoTime(MUNDO, c.id).length;
    const destinos = MUNDO.times.filter(x => x.id !== c.id);
    return { titulo: `Excluir ${t.nome}?`, acao: 'Excluir time',
      texto: n ? `${n} projeto(s) pertencem a este time e precisam de destino. Os squads deles serão remontados
        com os membros do time escolhido.` : 'Nenhum projeto pertence a este time.',
      extra: n ? `<div class="campo" style="margin-top:14px"><label for="destinoTime">Mover os projetos para</label>
        <select id="destinoTime">${destinos.map(x => `<option value="${x.id}">${esc(x.nome)}</option>`).join('')}</select></div>` : '' };
  }
  if (c.tipo === 'time') {
    const sel = document.getElementById('destinoTime');
    const destino = sel ? +sel.value : (MUNDO.times.find(x => x.id !== c.id) || {}).id;
    excluirTime(MUNDO, c.id, destino);
    if (UI.timeFiltro === String(c.id)) UI.timeFiltro = 'todos';
    fecharModal(); recalcular('time excluído, projetos remanejados'); return;
  }
  if (c.tipo === 'etapa') {
    const sel = document.getElementById('destinoEtapa');
    const destino = sel ? sel.value : Object.keys(FASES).filter(f => f !== c.id)[0];
    removerEtapa(MUNDO, c.id, destino, ETAPAS);
    if (UI.faseFiltro === c.id) UI.faseFiltro = 'todas';
    fecharModal(); recalcular('etapa removida, projetos movidos');
  }
}

function renderizar() {
  const alvo = document.getElementById('tela');
  alvo.innerHTML = TELAS[UI.tela][0]();

  });

  ligarDicas(alvo);

  atualizarRodape();
}
function irPara(tela) {
  UI.tela = tela; UI.editando = null; UI.confirmando = null;
  renderizar();
  document.getElementById('tela').focus({ preventScroll: true });
}
function recalcular(msg) {
  sincronizarPapeis();
  rodar();
  renderizar();
  status(msg || `cenário recalculado, solver ${MS} ms`, true);
  setTimeout(() => status(`solver ${MS} ms`, false), 2200);
}
function atualizarRodape() {
  document.getElementById('railPe').innerHTML =
    `perfil ${CFG.perfil}<br>${semana1().demanda.length} cerimônias/sem<br>${MUNDO.projetos.length} projetos · ${MUNDO.pessoas.length} pessoas`;
}

let TIMER = null;
function recalculoAdiado() {
  status('recalculando', true);
  clearTimeout(TIMER);
  TIMER = setTimeout(() => { rodar(); atualizarRodape(); atualizarCalculados(); status(`solver ${MS} ms`, false); }, 300);
}
function atualizarCalculados() {
  const k = doCenario(semana1()).kpi;
  const posto = (id, valor) => { const el = document.querySelector(`[data-resumo="${id}"]`); if (el) el.textContent = valor; };
  const capTotal = PAPEIS.reduce((s, pp) => s + premDe(CFG, pp).Cl * pessoasDo(pp).length, 0);
  const tetoTotal = PAPEIS.reduce((s, pp) => s + premDe(CFG, pp).teto * pessoasDo(pp).length, 0);
  const cargaTotal = k.porPessoa.reduce((s, x) => s + x.horas, 0);
  posto('cap', n1(capTotal) + ' h');
  posto('teto', n1(tetoTotal) + ' h');
  posto('carga', n1(cargaTotal) + ' h');
  posto('ocup', n0(tetoTotal ? cargaTotal / tetoTotal * 100 : 0) + '%');
  const elCarga = document.querySelector('[data-resumo="carga"]');
  if (elCarga) elCarga.style.color = `var(--${cargaTotal > tetoTotal ? 'bad' : 'ok'})`;
  PAPEIS.forEach((pp, i) => {
    const c = premDe(CFG, pp);
    const cl = document.querySelector(`[data-calc="cl-${i}"]`);
    if (!cl) return;
    cl.textContent = n1(c.Cl);
    document.querySelector(`[data-calc="teto-${i}"]`).innerHTML =
      n1(c.teto) + (c.limitadoPorHoras ? '<em class="flag">absoluto</em>' : '');
    document.querySelector(`[data-calc="tetomax-${i}"]`).textContent = n1(c.tetoMax);
    const ps = k.porPessoa.filter(x => x.papel === pp);
    const carga = ps.length ? ps.reduce((s, x) => s + x.horas, 0) / ps.length : 0;
    document.querySelector(`[data-calc="carga-${i}"]`).textContent = n1(carga);
    const ocup = c.teto > 0 ? carga / c.teto * 100 : 0;
    const acima = ps.filter(x => x.acimaLimite).length, ced = ps.filter(x => x.acimaTeto).length;
    document.querySelector(`[data-calc="sit-${i}"]`).innerHTML = acima ? selo(acima + ' acima do limite', 'ruim')
      : ced ? selo(ced + ' com concessão', 'aviso')
      : ocup > 85 ? selo(n0(ocup) + '% do teto', 'acento')
      : ocup < 45 ? selo(n0(ocup) + '% do teto', 'neutro') : selo(n0(ocup) + '% do teto', 'ok');
  });
}

function ligar() {

  todos('[data-filtro]', 'click', e => {
    const alvo = e.currentTarget.dataset.filtro;
    UI.painelFiltro = UI.painelFiltro === alvo ? null : alvo;

    renderizar();
    const b = document.getElementById('buscaFiltro');
    if (b) b.focus();
  });
  if (q('#buscaFiltro')) q('#buscaFiltro').addEventListener('input', e => {
    UI.buscaFiltro = e.target.value;

    const id = +e.currentTarget.dataset.opcao;
    const lista = UI.painelFiltro === 'pessoas' ? UI.pessoas : UI.projetos;
    const i = lista.indexOf(id);
    if (i >= 0) lista.splice(i, 1); else lista.push(id);

  });
  todos('[data-sel-todos]', 'click', () => {
    if (UI.painelFiltro === 'pessoas') UI.pessoas = MUNDO.pessoas.map(x => x.id);
    else UI.projetos = MUNDO.projetos.map(x => x.id);
    renderizar();
  });
  todos('[data-sel-nenhum]', 'click', () => {
    if (UI.painelFiltro === 'pessoas') UI.pessoas = []; else UI.projetos = [];
    renderizar();
  });
  todos('[data-fecha-filtro]', 'click', () => { UI.painelFiltro = null; renderizar(); });
  if (q('#limparFiltros')) q('#limparFiltros').addEventListener('click', () => {
    UI.pessoas = []; UI.projetos = []; UI.painelFiltro = null; renderizar();
  });
  todos('[data-abrir-proj]', 'click', e => {
    UI.projetos = [+e.currentTarget.dataset.abrirProj]; UI.painelFiltro = null; renderizar();
  });

  /* otimizador */
  if (q('#selHoriz')) q('#selHoriz').addEventListener('change', e => { CFG.horizonte = +e.target.value; recalcular(); });
  if (q('#selPerfil')) q('#selPerfil').addEventListener('change', e => { CFG.perfil = e.target.value; recalcular(); });
  if (q('#chaveReb')) q('#chaveReb').addEventListener('click', () => { CFG.rebalancear = !CFG.rebalancear; recalcular(); });
  if (q('#btnIrPremissas')) q('#btnIrPremissas').addEventListener('click', () => { UI.abaPremissas = 'cargo'; irPara('premissas'); });

  /* projetos */
  if (q('#buscaProj')) q('#buscaProj').addEventListener('input', e => {
    UI.busca = e.target.value;
    const pos = e.target.selectionStart;
    renderizar();
    const n = document.getElementById('buscaProj');
    if (n) { n.focus(); n.setSelectionRange(pos, pos); }
  });
  if (q('#filtroFase')) q('#filtroFase').addEventListener('change', e => { UI.faseFiltro = e.target.value; renderizar(); });
  if (q('#btnNovoProjeto')) q('#btnNovoProjeto').addEventListener('click', () => {
    RASCUNHO = {}; UI.editando = { tipo: 'projeto', id: null }; renderizarModais();
  });
  todos('[data-edita-proj]', 'click', e => {
    RASCUNHO = {}; UI.editando = { tipo: 'projeto', id: +e.currentTarget.dataset.editaProj }; UI.confirmando = null; renderizarModais();

  };
  liga('gInicio', 'inicio', true); liga('gFim', 'fim', true);
  liga('gAlmoco', 'almocoInicio', true); liga('gAlmocoDur', 'almocoDur', true);
  liga('gBuffer', 'buffer', true); liga('gDia', 'diaProtegido', false);
  if (q('#gPeso')) q('#gPeso').addEventListener('input', e => {
    GERAL.pesoPreferencia = +e.target.value;
    document.getElementById('gPesoV').textContent = n1(GERAL.pesoPreferencia);
    recalculoAdiado();
  });
  todos('#faixaSlots .slot', 'click', e => {
    const b = e.currentTarget;
    if (b.disabled) return;
    const s = +b.dataset.slot, i = GERAL.preferidos.indexOf(s);
    if (i >= 0) GERAL.preferidos.splice(i, 1); else GERAL.preferidos.push(s);
    b.setAttribute('aria-pressed', String(i < 0));
    recalculoAdiado();
  });

  /* premissas: por cargo */
  todos('.cel-edit[data-papel]', 'input', e => {
    const f = CAMPOS.find(x => x.k === e.target.dataset.campo);
    let v = parseFloat(e.target.value);
    if (isNaN(v)) return;
    v = Math.min(Math.max(v, f.min), f.max);
    PREM[e.target.dataset.papel][f.k] = v * f.esc;
    recalculoAdiado();
  });
  todos('.cel-edit[data-papel]', 'blur', e => {
    const f = CAMPOS.find(x => x.k === e.target.dataset.campo);
    e.target.value = PREM[e.target.dataset.papel][f.k] / f.esc;
  });
  if (q('#btnRestaurar')) q('#btnRestaurar').addEventListener('click', () => {
    Object.keys(PREM).forEach(pp => { if (!PREM_PADRAO[pp]) delete PREM[pp]; });
    Object.keys(PREM_PADRAO).forEach(pp => { PREM[pp] = Object.assign({}, PREM_PADRAO[pp]); });
    Object.keys(GERAL_PADRAO).forEach(k2 => { GERAL[k2] = JSON.parse(JSON.stringify(GERAL_PADRAO[k2])); });
    Object.keys(ETAPAS_PADRAO).forEach(k2 => { ETAPAS[k2] = Object.assign({}, ETAPAS_PADRAO[k2]); });
    Object.keys(CLIENTES_PADRAO).forEach(k2 => { CLIENTES[k2] = CLIENTES_PADRAO[k2]; });
    recalcular('premissas restauradas ao padrão');
  });
  if (q('#btnNovoCargo')) q('#btnNovoCargo').addEventListener('click', () => {
    RASCUNHO = {}; UI.editando = { tipo: 'cargo', id: null }; renderizarModais();
  });
  if (q('#btnSalvarCargo')) q('#btnSalvarCargo').addEventListener('click', () => {
    RASCUNHO.nome = document.getElementById('ecNome').value;
    const base = document.getElementById('ecBase');
    if (base) RASCUNHO.base = base.value;
    const nome = RASCUNHO.nome.trim();
    if (!nome) { RASCUNHO.erro = 'Informe o nome do cargo.'; renderizarModais(); return; }
    if (RASCUNHO.id) {
      if (nome === RASCUNHO.id) { fecharModal(); renderizar(); return; }
      if (!renomearCargo(MUNDO, PREM, RASCUNHO.id, nome)) {
        RASCUNHO.erro = 'Já existe um cargo com esse nome.'; renderizarModais(); return;
      }
      fecharModal();
      recalcular('cargo renomeado em pessoas, squads e playbook');
      return;
    }
    if (PREM[nome]) { RASCUNHO.erro = 'Já existe um cargo com esse nome.'; renderizarModais(); return; }
    PREM[nome] = Object.assign({}, PREM[RASCUNHO.base]);
    fecharModal();
    recalcular('cargo criado');
  });
  todos('[data-exclui-cargo]', 'click', e => {
    const pp = e.currentTarget.dataset.excluiCargo, uso = cargoEmUso(MUNDO, pp);
    if (uso.pessoas) {
      status(`${pp} tem ${uso.pessoas} pessoa(s), mova antes de excluir`, true);
      setTimeout(() => status(`solver ${MS} ms`, false), 3000);
      return;
    }
    UI.confirmando = { tipo: 'cargo', id: pp }; renderizarModais();
  });


  /* times */
  if (q('#btnNovoTime')) q('#btnNovoTime').addEventListener('click', () => {
    RASCUNHO = {}; UI.editando = { tipo: 'time', id: null }; renderizarModais();
  });
  todos('[data-edita-time]', 'click', e => {
    RASCUNHO = {}; UI.editando = { tipo: 'time', id: +e.currentTarget.dataset.editaTime }; renderizarModais();
  });
  todos('[data-exclui-time]', 'click', e => {
    UI.confirmando = { tipo: 'time', id: +e.currentTarget.dataset.excluiTime }; UI.editando = null; renderizarModais();
  });
  todos('[data-membro]', 'click', e => {
    const b = e.currentTarget, id = +b.dataset.membro, i = RASCUNHO.membros.indexOf(id);
    if (i >= 0) RASCUNHO.membros.splice(i, 1); else RASCUNHO.membros.push(id);
    RASCUNHO.nome = document.getElementById('etNome').value;
    renderizarModais();
  });
  if (q('#btnSalvarTime')) q('#btnSalvarTime').addEventListener('click', () => {
    RASCUNHO.nome = document.getElementById('etNome').value;
    if (!RASCUNHO.nome.trim()) { RASCUNHO.erro = 'Informe o nome do time.'; renderizarModais(); return; }
    if (!RASCUNHO.membros.length) { RASCUNHO.erro = 'Escolha ao menos uma pessoa.'; renderizarModais(); return; }
    salvarTime(MUNDO, { id: RASCUNHO.id, nome: RASCUNHO.nome.trim(), membros: RASCUNHO.membros });
    fecharModal(); recalcular('time salvo, squads remontados');
  });
  if (q('#filtroTime')) q('#filtroTime').addEventListener('change', e => { UI.timeFiltro = e.target.value; renderizar(); });
  todos('[data-filtra-time]', 'click', e => { UI.timeFiltro = e.currentTarget.dataset.filtraTime; renderizar(); });

  /* etapas */
  if (q('#btnNovaEtapa')) q('#btnNovaEtapa').addEventListener('click', () => {
    RASCUNHO = {}; UI.editando = { tipo: 'etapa', id: null }; renderizarModais();
  });
  todos('[data-edita-etapa]', 'click', e => {
    RASCUNHO = {}; UI.editando = { tipo: 'etapa', id: e.currentTarget.dataset.editaEtapa }; renderizarModais();
  });
  todos('[data-exclui-etapa]', 'click', e => {
    UI.confirmando = { tipo: 'etapa', id: e.currentTarget.dataset.excluiEtapa }; UI.editando = null; renderizarModais();
  });
  if (q('#btnSalvarEtapa')) q('#btnSalvarEtapa').addEventListener('click', () => {
    const g = id => document.getElementById(id);
    RASCUNHO.nome = g('eeNome').value;
    RASCUNHO.urgencia = +g('eeUrg').value;
    RASCUNHO.prazo = +g('eePrazo').value;
    const nome = RASCUNHO.nome.trim();
    if (!nome) { RASCUNHO.erro = 'Informe o nome da etapa.'; renderizarModais(); return; }
    if (RASCUNHO.id) {
      renomearEtapa(RASCUNHO.id, nome);
      ETAPAS[RASCUNHO.id] = { urgencia: RASCUNHO.urgencia, prazoDias: RASCUNHO.prazo };
      fecharModal(); recalcular('etapa atualizada');
      return;
    }
    const id = adicionarEtapa(nome, RASCUNHO.urgencia, RASCUNHO.prazo, ETAPAS);
    fecharModal(); recalcular('etapa criada, monte o playbook dela');
  });

  /* premissas: urgência */
  todos('[data-campo-etapa]', 'input', e => {
    const v = parseFloat(e.target.value);
    if (isNaN(v)) return;
    ETAPAS[e.target.dataset.fase] = Object.assign({}, etapaDe(CFG, e.target.dataset.fase));
    ETAPAS[e.target.dataset.fase][e.target.dataset.campoEtapa] = v;
    recalculoAdiado();
  });
  todos('[data-prioridade]', 'input', e => {
    const v = parseFloat(e.target.value);
    if (isNaN(v)) return;
    CLIENTES[e.target.dataset.prioridade] = v;
    recalculoAdiado();
  });
}

function lerRascunhoProjeto() {
  const v = id => document.getElementById(id);
  if (!v('epNome')) return;
  RASCUNHO.nome = v('epNome').value;
  RASCUNHO.fase = v('epFase').value;
  RASCUNHO.mes = +v('epMes').value;
  RASCUNHO.health = v('epHealth').value;
  RASCUNHO.prioridade = v('epPrioridade').value;
  RASCUNHO.rel = +v('epRel').value;
  RASCUNHO.dash = +v('epDash').value;
  RASCUNHO.integ = +v('epInteg').value;
  const s = {};
  document.querySelectorAll('.squad-sel').forEach(x => { if (x.value !== '') s[x.dataset.papel] = +x.value; });
  RASCUNHO.squad = s;
  RASCUNHO.erro = '';
}

/* ---- controles globais ---- */
const ICONE_LUA = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" aria-hidden="true"><path d="M21 13a9 9 0 11-10-10 7 7 0 0010 10z"/></svg>';
const ICONE_SOL = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M5 5l1.5 1.5M17.5 17.5L19 19M19 5l-1.5 1.5M6.5 17.5L5 19"/></svg>';

document.getElementById('btnTema').addEventListener('click', () => {
  UI.tema = UI.tema === 'claro' ? 'escuro' : 'claro';
  document.documentElement.dataset.tema = UI.tema;
  const b = document.getElementById('btnTema');
  b.innerHTML = UI.tema === 'escuro' ? ICONE_SOL : ICONE_LUA;
  b.setAttribute('aria-label', UI.tema === 'escuro' ? 'Ativar modo claro' : 'Ativar modo escuro');
  b.title = UI.tema === 'escuro' ? 'Modo claro' : 'Modo escuro';
});
document.getElementById('btnMenu').addEventListener('click', () => {
  UI.menu = UI.menu === 'aberto' ? 'fechado' : 'aberto';
  const app = document.getElementById('app'), b = document.getElementById('btnMenu');
  app.dataset.menu = UI.menu;
  b.setAttribute('aria-label', UI.menu === 'fechado' ? 'Expandir menu' : 'Recolher menu');
  b.title = b.getAttribute('aria-label');
});
document.getElementById('cenBase').addEventListener('click', () => trocarCenario('base'));
document.getElementById('cenOtm').addEventListener('click', () => trocarCenario('otm'));
function trocarCenario(c) {
  UI.cenario = c;
  document.getElementById('cenBase').setAttribute('aria-pressed', String(c === 'base'));
  document.getElementById('cenOtm').setAttribute('aria-pressed', String(c === 'otm'));
  renderizar();
}
document.getElementById('btnRodar').addEventListener('click', () => {
  if (UI.rodando) return;
  UI.rodando = true;
  const b = document.getElementById('btnRodar');
  b.disabled = true;
  if (UI.tela !== 'otimizador') irPara('otimizador');
  const t = document.getElementById('terminal');
  if (t) t.innerHTML = '<div class="cmd" style="opacity:1">&gt; cadencia optimize --recalcular</div>' +
    Array.from({ length: 4 }, () => `<div class="esqueleto" style="margin:8px 0;width:${45 + Math.random() * 45}%;opacity:1"></div>`).join('');
  status('otimizando', true);
  setTimeout(() => {
    rodar();
    UI.rodando = false;
    b.disabled = false;
    renderizar();
    escreverTerminal(true);
    const te = document.getElementById('tempoExec');
    if (te) te.textContent = `solver ${MS} ms, ${MUNDO.projetos.length} projetos, ${MUNDO.pessoas.length} pessoas, ${CFG.horizonte} semanas`;
    status(`plano recalculado, solver ${MS} ms`, true);
    setTimeout(() => status(`solver ${MS} ms`, false), 2400);
  }, 620);
});

document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && (UI.editando || UI.confirmando)) { e.preventDefault(); fecharModal(); }
});
document.getElementById('btnTema').innerHTML = ICONE_LUA;
montarNav();
renderizar();
status(`solver ${MS} ms`, false);

</script>
</body>
</html>
