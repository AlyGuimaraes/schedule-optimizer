function idDeTexto(t) {
  return String(t).toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '')
    .replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '').slice(0, 40);
}
function hueDeTexto(t) {
  let h = 0;
  for (let i = 0; i < t.length; i++) h = (h * 31 + t.charCodeAt(i)) % 360;
  return h;
}
// etapas do ciclo de implantação: criar, renomear e remover
function adicionarEtapa(rotulo, urgencia, prazoDias, etapasCfg) {
  let id = idDeTexto(rotulo) || 'etapa';
  if (FASES[id]) { let n = 2; while (FASES[id + '-' + n]) n++; id = id + '-' + n; }
  FASES[id] = { rotulo: String(rotulo).trim(), qtd: 0, hue: hueDeTexto(id) };
  PLAYBOOK[id] = [];
  PLAYBOOK_PADRAO[id] = [];
  if (etapasCfg) etapasCfg[id] = { urgencia: urgencia, prazoDias: prazoDias };
  return id;
}
function renomearEtapa(id, rotulo) {
  if (!FASES[id]) return false;
  FASES[id].rotulo = String(rotulo).trim();
  return true;
}
function removerEtapa(mundo, id, destino, etapasCfg) {
  if (!FASES[id]) return false;
  mundo.projetos.forEach(p => { if (p.fase === id) p.fase = destino; });
  delete FASES[id]; delete PLAYBOOK[id]; delete PLAYBOOK_PADRAO[id];
  if (etapasCfg) delete etapasCfg[id];
  mundo.projetos.forEach(pr => montarSquad(mundo, pr));
  return true;
}
function projetosNaEtapa(mundo, id) { return mundo.projetos.filter(p => p.fase === id).length; }

const PLAYBOOK = {
  kickoff: [
    { tipo: 'Kickoff Executivo', dur: 60, cada: 2, papeis: ['Gerente de Projeto', 'Analista Sênior', 'Líder Técnico'], obrig: true, prio: 1 },
    { tipo: 'Levantamento de Requisitos', dur: 90, cada: 1, papeis: ['Especialista', 'Analista Sênior'], obrig: true, prio: 2 }
  ],
  discovery: [
    { tipo: 'Reunião de Trabalho', dur: 90, cada: 1, papeis: ['Analista', 'Especialista'], obrig: true, prio: 2 },
    { tipo: 'Status Report', dur: 45, cada: 3, papeis: ['Gerente de Projeto', 'Analista Sênior'], obrig: true, prio: 3 },
    { tipo: 'Validação de Dados', dur: 60, cada: 4, papeis: ['Arquiteto de Dados', 'Analista Sênior'], obrig: false, prio: 5 }
  ],
  construcao: [
    { tipo: 'Reunião de Trabalho', dur: 60, cada: 4, papeis: ['Analista', 'Especialista'], obrig: true, prio: 2 },
    { tipo: 'Status Report', dur: 30, cada: 6, papeis: ['Líder Técnico'], obrig: true, prio: 3 },
    { tipo: 'Validação de Produto', dur: 60, cada: 8, papeis: ['Analista Sênior', 'Especialista'], obrig: false, prio: 5 }
  ],
  homologacao: [
    { tipo: 'Sessão de Homologação', dur: 90, cada: 1, papeis: ['Especialista', 'Analista Sênior'], obrig: true, prio: 1 },
    { tipo: 'Status Report', dur: 45, cada: 2, papeis: ['Gerente de Projeto', 'Líder Técnico'], obrig: true, prio: 3 }
  ],
  golive: [
    { tipo: 'Acompanhamento Pós Go-live', dur: 30, cada: 2, papeis: ['Analista'], obrig: true, prio: 2 },
    { tipo: 'Treinamento de Usuários', dur: 120, cada: 8, papeis: ['Especialista', 'Analista'], obrig: false, prio: 4 }
  ],
  sustentacao: [
    { tipo: 'Check-in de Sustentação', dur: 30, cada: 8, papeis: ['Analista'], obrig: true, prio: 4 }
  ]
};

// cópia imutável para o botão de restaurar padrões
const PLAYBOOK_PADRAO = JSON.parse(JSON.stringify(PLAYBOOK));

function restaurarPlaybook() {
  Object.keys(PLAYBOOK).forEach(f => { delete PLAYBOOK[f]; });
  Object.keys(FASES).forEach(f => {
    PLAYBOOK[f] = PLAYBOOK_PADRAO[f] ? JSON.parse(JSON.stringify(PLAYBOOK_PADRAO[f])) : [];
  });
}
function adicionarCerimonia(fase, c) { (PLAYBOOK[fase] = PLAYBOOK[fase] || []).push(c); }
function removerCerimonia(fase, indice) { PLAYBOOK[fase].splice(indice, 1); }

// renomear cargo: propaga para pessoas, squads e playbook
function renomearCargo(mundo, prem, de, para) {
  para = String(para || '').trim();
  if (!para || de === para || prem[para]) return false;
  const ordem = Object.keys(prem).map(k => [k === de ? para : k, prem[k]]);
  Object.keys(prem).forEach(k => { delete prem[k]; });
  ordem.forEach(([k, v]) => { prem[k] = v; });
  mundo.pessoas.forEach(p => { if (p.papel === de) p.papel = para; });
  mundo.projetos.forEach(pr => {
    if (Object.prototype.hasOwnProperty.call(pr.squad, de)) { pr.squad[para] = pr.squad[de]; delete pr.squad[de]; }
  });
  [PLAYBOOK, PLAYBOOK_PADRAO].forEach(pb => Object.values(pb).forEach(cs => cs.forEach(c => {
    c.papeis = c.papeis.map(x => (x === de ? para : x));
  })));
  return true;
}

const CLIENTES_A = ['Grupo', 'Cia', 'Holding', 'Rede', 'Indústrias', 'Agro', 'Log', 'Med'];
const CLIENTES_B = ['Aurora', 'Vértice', 'Montana', 'Ipê', 'Serra Azul', 'Andorra', 'Câmbio', 'Delta Sul',
  'Everest', 'Ferrolar', 'Guaraí', 'Horizonte', 'Itaúna', 'Jacarandá', 'Kaporã', 'Lumina',
  'Marfim', 'Nortis', 'Ourivés', 'Pampulha', 'Quatro Rios', 'Rubi', 'Solaris', 'Tramontana',
  'Urano', 'Verdaz', 'Xisto', 'Zênite', 'Bandeirante', 'Cristalina', 'Diamantina', 'Estrela'];

function construirMundo(seed = 7) {
  const rnd = mulberry32(seed);
  const pessoas = NOMES.map((n, i) => ({
    id: i, nome: n[0], papel: n[1],
    iniciais: n[0].split(' ').map(x => x[0]).join('').slice(0, 2)
  }));
  const pools = {};
  pessoas.forEach(p => { (pools[p.papel] = pools[p.papel] || []).push(p.id); });

  // esqueleto dos projetos
  const projetos = [];
  let idx = 0;
  Object.keys(FASES).forEach(fase => {
    for (let k = 0; k < FASES[fase].qtd; k++) {
      const nome = CLIENTES_A[Math.floor(rnd() * CLIENTES_A.length)] + ' ' +
        CLIENTES_B[Math.floor(rnd() * CLIENTES_B.length)];
      const health = rnd() < 0.72 ? 'verde' : (rnd() < 0.72 ? 'amarelo' : 'vermelho');
      const r = rnd();
      const prioridade = r < 0.18 ? 'alta' : (r < 0.62 ? 'media' : 'baixa');
      projetos.push({
        id: idx, nome: nome + ' ' + String.fromCharCode(65 + (idx % 26)),
        fase, squad: {}, health, prioridade,
        produtos: {
          relatorios: 2 + Math.floor(rnd() * 6),
          dashboards: 1 + Math.floor(rnd() * 5),
          integracoes: Math.floor(rnd() * 3)
        },
        mes: 1 + Math.floor(rnd() * 14)
      });
      idx++;
    }
  });

  // times de implantação: cada projeto pertence a um time e só usa gente dele.
  // cargos escassos (arquiteto, líder técnico, gerente) circulam entre os times.
  const NOMES_TIME = ['Squad Alfa', 'Squad Bravo', 'Squad Charlie', 'Squad Delta'];
  const times = NOMES_TIME.map((nome, i) => ({ id: i, nome, membros: [] }));
  const porPapel2 = {};
  pessoas.forEach(p => { (porPapel2[p.papel] = porPapel2[p.papel] || []).push(p.id); });
  Object.keys(porPapel2).forEach(pp => {
    const ids = porPapel2[pp];
    if (ids.length >= times.length) {
      ids.forEach((id, i) => times[i % times.length].membros.push(id));   // distribui
    } else {
      ids.forEach(id => times.forEach(t => t.membros.push(id)));          // compartilha
    }
  });
  const baralhoTime = [];
  while (baralhoTime.length < projetos.length) times.forEach(t => baralhoTime.push(t.id));
  for (let i = baralhoTime.length - 1; i > 0; i--) {
    const j = Math.floor(rnd() * (i + 1));
    [baralhoTime[i], baralhoTime[j]] = [baralhoTime[j], baralhoTime[i]];
  }
  projetos.forEach((pr, i) => { pr.timeId = baralhoTime[i]; });

  // atribuicao balanceada por papel (baralho equilibrado, sem correlacao com o id)
  const porPapel = {};
  projetos.forEach(pr => {
    [...new Set(PLAYBOOK[pr.fase].flatMap(c => c.papeis))].forEach(pp => {
      (porPapel[pp] = porPapel[pp] || []).push(pr.id);
    });
  });
  Object.keys(porPapel).forEach(pp => {
    const alvos = porPapel[pp];
    const pool = pools[pp] || [];
    if (!pool.length) return;
    const baralho = [];
    while (baralho.length < alvos.length) pool.forEach(id => baralho.push(id));
    for (let i = baralho.length - 1; i > 0; i--) {
      const j = Math.floor(rnd() * (i + 1));
      [baralho[i], baralho[j]] = [baralho[j], baralho[i]];
    }
    alvos.forEach((projId, i) => { projetos[projId].squad[pp] = baralho[i]; });
  });
  return { pessoas, projetos, times };
}

/* ── times ── */
function membrosDoTime(mundo, timeId) {
  const t = (mundo.times || []).find(x => x.id === timeId);
  if (!t) return mundo.pessoas.map(p => p.id);
  return t.membros.filter(id => mundo.pessoas[id]);
}
function timeDoProjeto(mundo, pr) {
  return (mundo.times || []).find(t => t.id === pr.timeId) || null;
}
function projetosDoTime(mundo, timeId) {
  return mundo.projetos.filter(p => p.timeId === timeId);
}
function cargosDoTime(mundo, timeId) {
  const c = {};
  membrosDoTime(mundo, timeId).forEach(id => { const p = mundo.pessoas[id]; c[p.papel] = (c[p.papel] || 0) + 1; });
  return c;
}
function salvarTime(mundo, d) {
  mundo.times = mundo.times || [];
  let t = (d.id !== undefined && d.id !== null) ? mundo.times.find(x => x.id === d.id) : null;
  if (!t) { t = { id: mundo.times.reduce((m, x) => Math.max(m, x.id), -1) + 1, membros: [] }; mundo.times.push(t); }
  t.nome = String(d.nome).trim();
  if (d.membros) t.membros = d.membros.slice();
  mundo.projetos.forEach(pr => montarSquad(mundo, pr));
  return t;
}
function excluirTime(mundo, id, destino) {
  mundo.projetos.forEach(pr => { if (pr.timeId === id) pr.timeId = destino; });
  mundo.times = mundo.times.filter(t => t.id !== id);
  mundo.projetos.forEach(pr => montarSquad(mundo, pr));
}

function gerarDemanda(mundo, semana = 1, cfg) {
  const dem = [];
  let id = 0;
  mundo.projetos.forEach(pr => {
    const et = etapaDe(cfg, pr.fase);
    const pc = pesoCliente(cfg, pr.prioridade || 'media');
    PLAYBOOK[pr.fase].forEach(c => {
      if ((pr.id + semana) % c.cada !== 0) return;
      if (c.papeis.some(pp => pr.squad[pp] === undefined || pr.squad[pp] === null)) return;  // sem quórum
      const pares = c.papeis.map(pp => [pp, pr.squad[pp]]).filter(v => v[1] !== undefined);
      const vistos = new Set(); const parts = [], paps = [];
      pares.forEach(([pp, id]) => { if (!vistos.has(id)) { vistos.add(id); parts.push(id); paps.push(pp); } });
      if (parts.length === 0) return;
      dem.push({
        id: id++, projetoId: pr.id, projeto: pr.nome, fase: pr.fase,
        tipo: c.tipo, dur: c.dur, slots: Math.ceil(c.dur / 30),
        participantes: parts, papeis: paps, obrig: c.obrig, prio: c.prio, health: pr.health,
        timeId: pr.timeId,
        prioridade: pr.prioridade || 'media', urgencia: et.urgencia, prazoDias: et.prazoDias, pesoCliente: pc,
        score: +(et.urgencia * pc).toFixed(2), sla: et.prazoDias <= 7 && c.obrig
      });
    });
  });
  return dem;
}


// ---------- edição do mundo (projetos, pessoas, cargos) ----------
function iniciaisDe(n) {
  return n.trim().split(/\s+/).filter(Boolean).map(x => x[0]).join('').slice(0, 2).toUpperCase();
}
function papeisNecessarios(fase) {
  return [...new Set(PLAYBOOK[fase].flatMap(c => c.papeis))];
}
function cargaDeProjetos(mundo) {
  const c = {};
  mundo.pessoas.forEach(p => { c[p.id] = 0; });
  mundo.projetos.forEach(pr => Object.values(pr.squad).forEach(id => { if (c[id] !== undefined) c[id]++; }));
  return c;
}
function menosCarregado(mundo, papel, excluir, carga, elegiveis) {
  carga = carga || cargaDeProjetos(mundo);
  let cand = mundo.pessoas.filter(p => p.papel === papel && (excluir || []).indexOf(p.id) < 0);
  if (elegiveis) cand = cand.filter(p => elegiveis.indexOf(p.id) >= 0);
  if (!cand.length) return undefined;
  return cand.sort((a, b) => carga[a.id] - carga[b.id])[0].id;
}
// garante que o squad cobre exatamente os papéis exigidos pela fase
function montarSquad(mundo, pr) {
  const nec = papeisNecessarios(pr.fase), squad = {}, carga = cargaDeProjetos(mundo);
  const elegiveis = membrosDoTime(mundo, pr.timeId);
  nec.forEach(pp => {
    const atual = pr.squad ? pr.squad[pp] : undefined;
    const valido = atual !== undefined && atual !== null && mundo.pessoas[atual] &&
      mundo.pessoas[atual].papel === pp && elegiveis.indexOf(atual) >= 0;
    squad[pp] = valido ? atual
      : menosCarregado(mundo, pp, Object.values(squad).filter(v => v !== undefined), carga, elegiveis);
  });
  pr.squad = squad;
  return pr;
}
function squadIncompleto(mundo, pr) {
  return papeisNecessarios(pr.fase).filter(pp => pr.squad[pp] === undefined || pr.squad[pp] === null);
}
function salvarProjeto(mundo, d) {
  let pr = (d.id !== undefined && d.id !== null) ? mundo.projetos.find(p => p.id === d.id) : null;
  if (!pr) { pr = { id: mundo.projetos.reduce((m, p) => Math.max(m, p.id), -1) + 1, squad: {} }; mundo.projetos.push(pr); }
  pr.nome = d.nome; pr.fase = d.fase; pr.mes = d.mes; pr.health = d.health; pr.produtos = d.produtos;
  pr.prioridade = d.prioridade || pr.prioridade || 'media';
  if (d.timeId !== undefined && d.timeId !== null) pr.timeId = d.timeId;
  if (pr.timeId === undefined && mundo.times && mundo.times.length) pr.timeId = mundo.times[0].id;
  if (d.squad) pr.squad = Object.assign({}, d.squad);
  montarSquad(mundo, pr);
  return pr;
}
function excluirProjeto(mundo, id) {
  mundo.projetos = mundo.projetos.filter(p => p.id !== id);
}
function salvarPessoa(mundo, d) {
  if (d.id !== undefined && d.id !== null) {
    const p = mundo.pessoas[d.id];
    const trocou = p.papel !== d.papel;
    p.nome = d.nome; p.papel = d.papel; p.iniciais = iniciaisDe(d.nome);
    if (trocou) mundo.projetos.forEach(pr => Object.keys(pr.squad).forEach(pp => {
      if (pr.squad[pp] === p.id && pp !== d.papel) pr.squad[pp] = undefined;
    }));
  } else {
    mundo.pessoas.push({ id: mundo.pessoas.length, nome: d.nome, papel: d.papel, iniciais: iniciaisDe(d.nome) });
  }
  mundo.projetos.forEach(pr => montarSquad(mundo, pr));
}
function excluirPessoa(mundo, id) {
  (mundo.times || []).forEach(t => { t.membros = t.membros.filter(x => x !== id).map(x => (x > id ? x - 1 : x)); });
  const mapa = {};
  mundo.pessoas.forEach(p => { if (p.id < id) mapa[p.id] = p.id; else if (p.id > id) mapa[p.id] = p.id - 1; });
  mundo.pessoas = mundo.pessoas.filter(p => p.id !== id);
  mundo.pessoas.forEach((p, i) => { p.id = i; });
  mundo.projetos.forEach(pr => Object.keys(pr.squad).forEach(pp => {
    const nv = mapa[pr.squad[pp]];
    pr.squad[pp] = (nv === undefined) ? undefined : nv;
  }));
  mundo.projetos.forEach(pr => montarSquad(mundo, pr));
}
// redistribui todas as cadeiras pela menor carga (usado após entradas/saídas no time)
function rebalancearAlocacao(mundo) {
  const carga = {};
  mundo.pessoas.forEach(p => { carga[p.id] = 0; });
  mundo.projetos.forEach(pr => {
    const nec = papeisNecessarios(pr.fase), squad = {};
    nec.forEach(pp => {
      const usados = Object.values(squad);
      const elegiveis = membrosDoTime(mundo, pr.timeId);
      const cand = mundo.pessoas.filter(x => x.papel === pp && usados.indexOf(x.id) < 0 && elegiveis.indexOf(x.id) >= 0);
      if (!cand.length) { squad[pp] = undefined; return; }
      cand.sort((a, b) => carga[a.id] - carga[b.id] || a.id - b.id);
      squad[pp] = cand[0].id; carga[cand[0].id]++;
    });
    pr.squad = squad;
  });
}
function cargoEmUso(mundo, papel) {
  const pessoas = mundo.pessoas.filter(p => p.papel === papel).length;
  const cerimonias = Object.values(PLAYBOOK).flat().filter(c => c.papeis.indexOf(papel) >= 0).length;
  return { pessoas, cerimonias };
}

// ---------- ocupação ----------
function novaOcupacao(nPessoas) {
  const o = [];
  for (let p = 0; p < nPessoas; p++) {
    o.push(Array.from({ length: DIAS }, () => new Array(SLOTS_DIA).fill(null)));
  }
  return o;
}

function almoco(G, t) { return t >= G.almocoInicio && t < G.almocoInicio + G.almocoDur; }
function diaBloqueado(G, d, s, len) {
  if (G.diaProtegido === 'sexta' && d === DIAS - 1) return true;
  if (G.diaProtegido === 'sexta-tarde' && d === DIAS - 1 && s + len > G.almocoInicio + G.almocoDur) return true;
  return false;
}
function livre(oc, pessoa, d, s, len, G, comBuffer) {
  G = G || GERAL_PADRAO;
  if (s < G.inicio || s + len > G.fim) return false;
  if (diaBloqueado(G, d, s, len)) return false;
  for (let i = 0; i < len; i++) {
    const t = s + i;
    if (t >= SLOTS_DIA || almoco(G, t)) return false;
    if (oc[pessoa][d][t] !== null) return false;
  }
  if (comBuffer && G.buffer > 0) {           // respiro entre duas reuniões
    for (let i = 1; i <= G.buffer; i++) {
      const a = s - i, b = s + len + i - 1;
      if (a >= G.inicio && !almoco(G, a) && oc[pessoa][d][a] !== null) return false;
      if (b < G.fim && !almoco(G, b) && oc[pessoa][d][b] !== null) return false;
    }
  }
  return true;
}

function marcar(oc, ev, d, s) {
  ev.participantes.forEach(p => {
    for (let i = 0; i < ev.slots; i++) oc[p][d][s + i] = ev.id;
  });
  ev.dia = d; ev.slot = s;
}

// ---------- baseline (agenda atual, sem política) ----------
function agendarBaseline(demanda, nPessoas, seed, G) {
  G = G || GERAL_PADRAO;
  const rnd = mulberry32(seed || 21);
  const oc = novaOcupacao(nPessoas);
  const alocadas = [], naoAlocadas = [];
  const ordem = [...demanda].sort(() => rnd() - 0.5);
  ordem.forEach(ev => {
    // comportamento real: procura o maior bloco livre comum e marca no MEIO dele
    let melhor = null;
    for (let tent = 0; tent < 8 && !melhor; tent++) {
      const d = Math.floor(rnd() * DIAS);
      let run = [], blocos = [];
      for (let t = G.inicio; t < G.fim; t++) {
        const ok = !almoco(G, t) && ev.participantes.every(p => oc[p][d][t] === null);
        if (ok) run.push(t); else { if (run.length) blocos.push(run); run = []; }
      }
      if (run.length) blocos.push(run);
      const cand = blocos.filter(b => b.length >= ev.slots)
        .sort((a, b) => b.length - a.length)[0];
      if (cand) {
        const centro = cand[0] + Math.max(0, Math.floor((cand.length - ev.slots) / 2));
        if (ev.participantes.every(p => livre(oc, p, d, centro, ev.slots, G))) melhor = { d, s: centro };
      }
    }
    if (!melhor) {
      for (let d = 0; d < DIAS && !melhor; d++)
        for (let s = G.inicio; s + ev.slots <= G.fim && !melhor; s++)
          if (ev.participantes.every(p => livre(oc, p, d, s, ev.slots, G))) melhor = { d, s };
    }
    if (melhor) { marcar(oc, ev, melhor.d, melhor.s); alocadas.push(ev); }
    else naoAlocadas.push(ev);
  });
  return { oc, alocadas, naoAlocadas };
}

// ---------- otimizador ----------
function custoDia(oc, p, d, blocoMin, G) {
  G = G || GERAL_PADRAO;
  let blocos = 0, foco = 0, livres = 0, run = 0;
  for (let t = G.inicio; t < G.fim; t++) {
    if (almoco(G, t)) { if (run >= blocoMin) foco += run; if (run > 0) blocos++; run = 0; continue; }
    if (oc[p][d][t] === null) { run++; livres++; }
    else { if (run >= blocoMin) foco += run; if (run > 0) blocos++; run = 0; }
  }
  if (run >= blocoMin) foco += run;
  if (run > 0) blocos++;
  return { penal: (livres - foco) + blocos * 0.5, foco, livres };
}

function otimizar(demanda, pessoas, cfg) {
  const n = pessoas.length;
  const oc = novaOcupacao(n);
  const PP = pessoas.map(p => premDe(cfg, p.papel));
  const PF = PERFIS[cfg.perfil] || PERFIS.equilibrio;
  const G = geralDe(cfg);
  const pref = new Set(G.preferidos);
  const acum = cfg.acumulado || new Array(n).fill(0);          // horas já usadas nas semanas anteriores
  const semanaIdx = cfg.semanaIdx || 1;
  const tetoMes = p => PP[p].maxHorasMes * semanaIdx / 4.33;   // orçamento mensal pró-rata
  const carga = new Array(n).fill(0);
  const porDia = Array.from({ length: n }, () => new Array(DIAS).fill(0));
  const hDia = Array.from({ length: n }, () => new Array(DIAS).fill(0));
  const alocadas = [], concessoes = [];

  // limites efetivos: nível 0 = premissa-alvo · nível 1 = máximo que o perfil autoriza ceder
  const tetoEf = (p, r) => r ? PP[p].teto + (PP[p].tetoMax - PP[p].teto) * PF.usaTolerancia : PP[p].teto;
  const reunEf = (p, r) => PP[p].maxReunioesDia + (r ? PF.extraReunioes : 0);
  const horasEf = (p, r) => PP[p].maxHorasDia + (r ? PF.extraHoras : 0);
  const janelaEf = (p, r) => (r && PF.cedeJanela) ? Math.max(0, PP[p].focoProt - 2) : PP[p].focoProt;
  const durEf = (p, r) => PP[p].duracaoMax + (r ? PF.extraDuracao : 0);

  function viavel(parts, d, s, slots, h, r) {
    for (const p of parts) {
      if (s < Math.max(G.inicio, janelaEf(p, r))) return false;
      if (slots > durEf(p, r)) return false;
      if (!livre(oc, p, d, s, slots, G, true)) return false;
      if (porDia[p][d] + 1 > reunEf(p, r)) return false;
      if (hDia[p][d] + h > horasEf(p, r) + 1e-9) return false;
    }
    return true;
  }
  function custo(parts, d, s, slots, ev) {
    let c = 0;
    parts.forEach(p => {
      const antes = custoDia(oc, p, d, PP[p].blocoFocoMin, G).penal;
      for (let i = 0; i < slots; i++) oc[p][d][s + i] = -1;
      const depois = custoDia(oc, p, d, PP[p].blocoFocoMin, G).penal;
      for (let i = 0; i < slots; i++) oc[p][d][s + i] = null;
      c += (depois - antes) * PF.pesoFrag;
      for (let i = 0; i < slots; i++) if (!pref.has(s + i)) c += G.pesoPreferencia;   // fora do horário preferido
      c += porDia[p][d] === 0 ? 1.2 : 0.3 * porDia[p][d];
      const folga = PP[p].teto - carga[p];                     // quem está mais perto do alvo é preservado
      c += folga <= 0 ? 2.5 : Math.max(0, 1.4 - folga);
    });
    if (PF.ancorar && ev && d !== (ev.projetoId % DIAS)) c += 2.2;
    // cerimônia com prazo curto é puxada para o começo da semana e do dia
    const urg = ev && ev.sla ? 2.4 : 0.02;
    return c + s * (ev && ev.sla ? 0.06 : 0.01) + d * urg;
  }
  function melhorSlot(parts, slots, h, r, ev) {
    let m = null;
    for (let d = 0; d < DIAS; d++)
      for (let s = G.inicio; s + slots <= G.fim; s++) {
        if (!viavel(parts, d, s, slots, h, r)) continue;
        const c = custo(parts, d, s, slots, ev);
        if (m === null || c < m.custo) m = { d, s, custo: c };
      }
    return m;
  }
  // registra o que foi cedido em relação à premissa-alvo do cargo
  function registrar(ev, parts, d, s, h) {
    parts.forEach(p => {
      const c = PP[p], nome = pessoas[p].nome, cedidas = [];
      if (carga[p] + h > c.teto + 1e-9) cedidas.push({ premissa: 'teto de reunião', alvo: c.teto, valor: carga[p] + h, un: 'h' });
      if (porDia[p][d] + 1 > c.maxReunioesDia) cedidas.push({ premissa: 'máx. reuniões/dia', alvo: c.maxReunioesDia, valor: porDia[p][d] + 1, un: '' });
      if (hDia[p][d] + h > c.maxHorasDia + 1e-9) cedidas.push({ premissa: 'máx. horas/dia', alvo: c.maxHorasDia, valor: hDia[p][d] + h, un: 'h' });
      if (s < c.focoProt) cedidas.push({ premissa: 'janela protegida', alvo: c.focoProt / 2, valor: s / 2, un: 'h' });
      if (ev.slots > c.duracaoMax) cedidas.push({ premissa: 'duração máx. da reunião', alvo: c.duracaoMax / 2, valor: ev.slots / 2, un: 'h' });
      cedidas.forEach(x => concessoes.push(Object.assign({
        pessoa: nome, pessoaId: p, papel: pessoas[p].papel, projeto: ev.projeto, cerimonia: ev.tipo
      }, x)));
    });
  }
  function confirmar(ev, m, relaxado) {
    const h = ev.dur / 60;
    if (relaxado) registrar(ev, ev.participantes, m.d, m.s, h);
    marcar(oc, ev, m.d, m.s);
    ev.relaxado = !!relaxado;
    ev.participantes.forEach(p => { carga[p] += h; porDia[p][m.d]++; hDia[p][m.d] += h; });
    alocadas.push(ev);
  }

  // fila de atendimento: prioridade da cerimônia corrigida pela urgência da etapa e do cliente
  const risco = { vermelho: 0, amarelo: 1, verde: 2 };
  const pesoUrg = PF.fila === 'criticidade' ? 0.55 : 0.22;
  const rank = ev => ev.prio - pesoUrg * ((ev.score || 4) / 3) - (PF.fila === 'criticidade' ? (2 - risco[ev.health]) * 0.3 : 0);
  const ordem = [...demanda].sort((a, b) =>
    (rank(a) - rank(b)) || (b.participantes.length - a.participantes.length) || (b.dur - a.dur));

  // ---- camada 1: tudo dentro da premissa-alvo ----
  const sobra1 = [];
  ordem.forEach(ev => {
    const h = ev.dur / 60;
    if (ev.participantes.some(p => carga[p] + h > tetoEf(p, false) + 1e-9 ||
        acum[p] + carga[p] + h > tetoMes(p) + 1e-9)) { sobra1.push(ev); return; }
    const m = melhorSlot(ev.participantes, ev.slots, h, false, ev);
    if (m) confirmar(ev, m, false); else sobra1.push(ev);
  });

  // ---- camada 2: rebalanceamento de cadeira, ainda dentro do alvo ----
  const trocas = [], sobra2 = [];
  if (cfg.rebalancear !== false) {
    const porPapel = {};
    pessoas.forEach(p => { (porPapel[p.papel] = porPapel[p.papel] || []).push(p.id); });
    const elegiveisDe = ev => (cfg.mundo ? membrosDoTime(cfg.mundo, ev.timeId) : null);
    sobra1.forEach(ev => {
      const h = ev.dur / 60, novos = ev.participantes.slice(), subs = [];
      ev.participantes.forEach((pid, i) => {
        if (carga[pid] + h <= PP[pid].teto + 1e-9 && acum[pid] + carga[pid] + h <= tetoMes(pid) + 1e-9) return;
        const eleg = elegiveisDe(ev);
        const alt = (porPapel[ev.papeis[i]] || [])
          .filter(x => novos.indexOf(x) < 0 && (!eleg || eleg.indexOf(x) >= 0) &&
            carga[x] + h <= PP[x].teto - 0.3 && acum[x] + carga[x] + h <= tetoMes(x) + 1e-9)
          .sort((a, b) => (carga[a] / PP[a].teto) - (carga[b] / PP[b].teto))[0];
        if (alt !== undefined) { subs.push({ de: pid, para: alt, papel: ev.papeis[i] }); novos[i] = alt; }
      });
      if (!subs.length || novos.some(p => carga[p] + h > PP[p].teto + 1e-9 ||
          acum[p] + carga[p] + h > tetoMes(p) + 1e-9)) { sobra2.push(ev); return; }
      const cand = Object.assign({}, ev, { participantes: novos });
      const m = melhorSlot(novos, cand.slots, h, false, cand);
      if (m) { cand.trocas = subs; confirmar(cand, m, false); trocas.push({ ev: cand, subs }); }
      else sobra2.push(ev);
    });
  } else sobra1.forEach(ev => sobra2.push(ev));

  // ---- camada 3: relaxamento controlado, só para cerimônia obrigatória ----
  const adiadas = [];
  sobra2.sort((a, b) => a.prio - b.prio).forEach(ev => {
    const h = ev.dur / 60;
    if (!ev.obrig) { adiadas.push(Object.assign({}, ev, { motivo: 'opcional · sem folga no alvo' })); return; }
    if (ev.participantes.some(p => acum[p] + carga[p] + h > tetoMes(p) + 1e-9)) {
      adiadas.push(Object.assign({}, ev, { motivo: 'excede o teto mensal do cargo' })); return;
    }
    if (ev.participantes.some(p => carga[p] + h > tetoEf(p, true) + 1e-9)) {
      adiadas.push(Object.assign({}, ev, { motivo: 'excede o limite semanal aceitável' })); return;
    }
    const m = melhorSlot(ev.participantes, ev.slots, h, true, ev);
    if (m) confirmar(ev, m, true);
    else adiadas.push(Object.assign({}, ev, { motivo: 'sem janela viável nem com tolerância' }));
  });

  // ---- déficit estrutural: o que não coube, convertido em FTE por cargo ----
  const deficit = {};
  adiadas.forEach(ev => ev.papeis.forEach(pp => {
    deficit[pp] = deficit[pp] || { horas: 0, cerimonias: 0, obrigatorias: 0, fte: 0 };
    deficit[pp].horas += ev.dur / 60; deficit[pp].cerimonias++;
    if (ev.obrig) deficit[pp].obrigatorias++;
  }));
  adiadas.forEach(ev => { if (ev.obrig) ev.papeis.forEach(pp => { deficit[pp].horasObrig = (deficit[pp].horasObrig || 0) + ev.dur / 60; }); });
  Object.keys(deficit).forEach(pp => {
    const c = premDe(cfg, pp);
    deficit[pp].horasObrig = deficit[pp].horasObrig || 0;
    deficit[pp].fte = c.teto > 0 ? +(deficit[pp].horas / c.teto).toFixed(2) : 0;
    deficit[pp].fteObrig = c.teto > 0 ? +(deficit[pp].horasObrig / c.teto).toFixed(2) : 0;
  });

  const slaTotal = demanda.filter(x => x.sla).length;
  const slaAloc = alocadas.filter(x => x.sla).length;
  const slaViolado = adiadas.filter(x => x.sla);
  const obrigTotal = demanda.filter(x => x.obrig).length;
  const obrigAloc = alocadas.filter(x => x.obrig).length;
  const cobertura = {
    total: demanda.length ? +(alocadas.length / demanda.length * 100).toFixed(1) : 100,
    obrigatoria: obrigTotal ? +(obrigAloc / obrigTotal * 100).toFixed(1) : 100,
    relaxadas: alocadas.filter(x => x.relaxado).length,
    sla: slaTotal ? +(slaAloc / slaTotal * 100).toFixed(1) : 100,
    slaTotal, slaViolado
  };
  return { oc, alocadas, adiadas, trocas, concessoes, deficit, cobertura, carga, acum, PP, perfil: PF, perfilId: cfg.perfil };
}

// ---------- KPIs ----------
function kpis(oc, alocadas, pessoas, cfg) {
  const G = geralDe(cfg);
  const porPessoa = pessoas.map(p => {
    const c = premDe(cfg, p.papel);
    let horas = 0, reunioes = 0, foco = 0, livres = 0, blocosFoco = 0;
    const dias = new Set();
    for (let d = 0; d < DIAS; d++) {
      const r = custoDia(oc, p.id, d, c.blocoFocoMin, G);
      foco += r.foco; livres += r.livres;
      let run = 0;
      for (let t = G.inicio; t < G.fim; t++) {
        if (almoco(G, t)) { if (run >= c.blocoFocoMin) blocosFoco++; run = 0; continue; }
        if (oc[p.id][d][t] === null) run++; else { if (run >= c.blocoFocoMin) blocosFoco++; run = 0; }
      }
      if (run >= c.blocoFocoMin) blocosFoco++;
    }
    alocadas.forEach(ev => {
      if (ev.participantes.includes(p.id)) { horas += ev.dur / 60; reunioes++; dias.add(ev.dia); }
    });
    const tx = horas / c.Cl;
    return {
      id: p.id, nome: p.nome, papel: p.papel, iniciais: p.iniciais,
      Cl: +c.Cl.toFixed(2), teto: +c.teto.toFixed(2), tetoPct: 100 - c.produtivoMin,
      produtivoMin: c.produtivoMin,
      horas: +horas.toFixed(2), reunioes,
      taxa: +(tx * 100).toFixed(1),
      produtivo: +((1 - tx) * 100).toFixed(1),
      folga: +(c.teto - horas).toFixed(2),
      blocosFoco,
      frag: livres > 0 ? +(1 - foco / livres).toFixed(2) : 0,
      diasComReuniao: dias.size,
      tetoMax: +c.tetoMax.toFixed(2), tolerancia: c.tolerancia,
      tetoAlvo: +c.tetoAlvo.toFixed(2), maxHorasSemana: c.maxHorasSemana, maxHorasMes: c.maxHorasMes,
      limitadoPorHoras: c.limitadoPorHoras,
      acimaTeto: horas > c.teto + 1e-9,
      acimaLimite: horas > c.tetoMax + 1e-9,
      noAlvo: horas <= c.teto + 1e-9
    };
  });
  const media = a => a.reduce((s, x) => s + x, 0) / a.length;
  return {
    porPessoa,
    ClMedio: +media(porPessoa.map(x => x.Cl)).toFixed(1),
    tetoMedio: +media(porPessoa.map(x => x.teto)).toFixed(1),
    produtivoMedio: +media(porPessoa.map(x => x.produtivo)).toFixed(1),
    alvoMedio: +media(porPessoa.map(x => x.produtivoMin)).toFixed(1),
    taxaMedia: +media(porPessoa.map(x => x.taxa)).toFixed(1),
    horasTotais: +porPessoa.reduce((s, x) => s + x.horas, 0).toFixed(1),
    reunioesTotais: alocadas.length,
    blocosFocoMedio: +media(porPessoa.map(x => x.blocosFoco)).toFixed(1),
    fragMedia: +media(porPessoa.map(x => x.frag)).toFixed(2),
    acimaTeto: porPessoa.filter(x => x.acimaTeto).length,
    acimaLimite: porPessoa.filter(x => x.acimaLimite).length,
    aderencia: +(porPessoa.filter(x => x.noAlvo).length / porPessoa.length * 100).toFixed(1)
  };
}

// ---------- análise de capacidade ----------
// Demanda teórica por cargo, direto do playbook, contando inclusive o que
// hoje não acontece por falta de quórum. É o que responde "falta gente?".
function demandaPorCargo(mundo, cfg, nSemanas) {
  nSemanas = nSemanas || 4;
  const horas = {}, cerim = {}, semQuorum = {};
  for (let w = 1; w <= nSemanas; w++) {
    mundo.projetos.forEach(pr => {
      (PLAYBOOK[pr.fase] || []).forEach(c => {
        if ((pr.id + w) % c.cada !== 0) return;
        const falta = c.papeis.some(pp => pr.squad[pp] === undefined || pr.squad[pp] === null);
        c.papeis.forEach(pp => {
          horas[pp] = (horas[pp] || 0) + c.dur / 60;
          cerim[pp] = (cerim[pp] || 0) + 1;
          if (falta) semQuorum[pp] = (semQuorum[pp] || 0) + c.dur / 60;
        });
      });
    });
  }
  const saida = {};
  Object.keys(horas).forEach(pp => {
    saida[pp] = {
      horasSemana: horas[pp] / nSemanas,
      cerimoniasSemana: cerim[pp] / nSemanas,
      horasSemQuorum: (semQuorum[pp] || 0) / nSemanas
    };
  });
  return saida;
}

// Quadro de pessoal: por cargo, quanto a demanda pede contra o que o time entrega.
function analiseCapacidade(mundo, cfg, nSemanas) {
  const dem = demandaPorCargo(mundo, cfg, nSemanas);
  const papeis = [...new Set(Object.keys(cfg.papeis || PREM_PADRAO).concat(Object.keys(dem)))];
  return papeis.map(pp => {
    const c = premDe(cfg, pp);
    const pessoas = mundo.pessoas.filter(p => p.papel === pp).length;
    const d = dem[pp] || { horasSemana: 0, cerimoniasSemana: 0, horasSemQuorum: 0 };
    const capacidade = c.teto * pessoas;
    const saldoH = capacidade - d.horasSemana;
    const fteNecessario = c.teto > 0 ? d.horasSemana / c.teto : 0;
    const saldoFte = c.teto > 0 ? saldoH / c.teto : 0;
    const ocupacao = capacidade > 0 ? d.horasSemana / capacidade * 100 : (d.horasSemana > 0 ? Infinity : 0);
    let situacao = 'equilibrado', acao = 'manter o time como está';
    if (!pessoas && d.horasSemana > 0) { situacao = 'sem ninguém'; acao = `contratar ${Math.ceil(fteNecessario)} para o cargo`; }
    else if (saldoFte <= -0.25) { situacao = 'falta gente'; acao = `contratar ${Math.ceil(-saldoFte)} pessoa(s)`; }
    else if (ocupacao > 88) { situacao = 'no limite'; acao = 'sem folga para novos projetos'; }
    else if (ocupacao < 45 && pessoas > 0) { situacao = 'folga'; acao = `cabe ${Math.floor(saldoFte)} projeto-pessoa a mais`; }
    return { papel: pp, pessoas, teto: c.teto, demanda: d.horasSemana, cerimonias: d.cerimoniasSemana,
      semQuorum: d.horasSemQuorum, capacidade, saldoH, fteNecessario, saldoFte, ocupacao, situacao, acao };
  }).sort((a, b) => a.saldoFte - b.saldoFte);
}

// ---------- simulação de horizonte (4 semanas) ----------
function simular(mundo, cfg) {
  const H = Math.max(1, cfg.horizonte || 4);
  const semanas = [];
  const acumulado = new Array(mundo.pessoas.length).fill(0);
  for (let w = 1; w <= H; w++) {
    const dem = gerarDemanda(mundo, w, cfg);
    const base = agendarBaseline(dem.map(e => Object.assign({}, e)), mundo.pessoas.length, 20 + w, geralDe(cfg));
    const cfgW = Object.assign({}, cfg, { acumulado: acumulado.slice(), semanaIdx: w });
    const otm = otimizar(dem.map(e => Object.assign({}, e)), mundo.pessoas, cfgW);
    otm.alocadas.forEach(ev => ev.participantes.forEach(p => { acumulado[p] += ev.dur / 60; }));
    semanas.push({
      semana: w, demanda: dem,
      base: Object.assign({}, base, { kpi: kpis(base.oc, base.alocadas, mundo.pessoas, cfg) }),
      otm: Object.assign({}, otm, { kpi: kpis(otm.oc, otm.alocadas, mundo.pessoas, cfg) })
    });
  }
  const F = 4.33 / H;
  const mes = { base: {}, otm: {} };
  ['base', 'otm'].forEach(k => {
    mes[k].reunioes = Math.round(semanas.reduce((s, w) => s + w[k].alocadas.length, 0) * F);
    mes[k].horas = +(semanas.reduce((s, w) => s + w[k].kpi.horasTotais, 0) * F).toFixed(1);
    mes[k].produtivo = +(semanas.reduce((s, w) => s + w[k].kpi.produtivoMedio, 0) / H).toFixed(1);
    mes[k].acimaTeto = Math.max.apply(null, semanas.map(w => w[k].kpi.acimaTeto));
    mes[k].porPessoa = mundo.pessoas.map(p => ({
      id: p.id,
      reunioes: Math.round(semanas.reduce((s, w) => s + w[k].kpi.porPessoa[p.id].reunioes, 0) * F),
      horas: +(semanas.reduce((s, w) => s + w[k].kpi.porPessoa[p.id].horas, 0) * F).toFixed(1)
    }));
  });
  return { semanas, mes };
}

function indicador(rotulo, valor, opc) {
  opc = opc || {};
  const v = opc.delta;
  let rodape = opc.contexto ? `<div class="var">${opc.contexto}</div>` : '<div class="var">&nbsp;</div>';
  if (v !== undefined) {
    const igual = Math.abs(v.d) < 0.05;
    const seta = igual ? '=' : (v.d > 0 ? '▲' : '▼');
    rodape = `<div class="var ${igual ? '' : (v.bom ? 'sobe' : 'desce')}">${seta} ${n1(Math.abs(v.d))}${v.suf || ''} vs. atual</div>`;
  }
  return `<dl class="ind"><dt>${rotulo}</dt><dd class="${opc.tom || ''}">${valor}<small>${opc.un || ''}</small></dd>${rodape}</dl>`;
}
function faixa(itens) { return `<div class="faixa">${itens.join('')}</div>`; }
function delta(antes, depois, menorMelhor, suf) {
  const d = depois - antes;
  return { d, bom: menorMelhor ? d < 0 : d > 0, suf: suf || '' };
}
function trilha(valor, max, limite, tom) {
  return `<div class="trilha"><i class="${tom || ''}" style="width:${Math.min(valor / max * 100, 100)}%"></i>
    ${limite === undefined ? '' : `<span class="marca-lim" style="left:${Math.min(limite / max * 100, 100)}%"></span>`}</div>`;
}
function barras(dados, opc) {
  opc = opc || {};
  const W = 560, H = opc.h || 170, padT = 22, padB = 30, padL = opc.eixoY === false ? 4 : 30;
  const max = Math.max.apply(null, dados.map(d => Math.max(d.v, d.ref || 0))) * 1.18 || 1;
  const alturaUtil = H - padT - padB;
  const lg = (W - padL - 6) / dados.length;
  const r = 6;
  let s = `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto" role="img"
    aria-label="${esc(opc.alt || 'gráfico de barras')}">`;
  // CartesianGrid vertical={false} strokeDasharray="3 3"
  for (let i = 0; i <= 3; i++) {
    const y = padT + alturaUtil * (i / 3);
    s += `<line x1="${padL}" x2="${W - 6}" y1="${y}" y2="${y}" stroke="var(--border)" stroke-dasharray="3 3"/>`;
    if (opc.eixoY !== false)
      s += `<text x="${padL - 7}" y="${y + 4}" font-size="11" fill="var(--muted-foreground)" text-anchor="end"
        font-family="Geist">${n0(max - max * (i / 3))}</text>`;
  }
  dados.forEach((d, i) => {
    const alt = Math.max(alturaUtil * (d.v / max), 2);
    const largura = lg * 0.62, x = padL + i * lg + (lg - largura) / 2, y = padT + alturaUtil - alt;
    const raio = Math.min(r, alt, largura / 2);
    const cor = d.cor || 'var(--chart-1)';
    s += `<path d="M${x},${padT + alturaUtil} L${x},${y + raio} Q${x},${y} ${x + raio},${y}
      L${x + largura - raio},${y} Q${x + largura},${y} ${x + largura},${y + raio}
      L${x + largura},${padT + alturaUtil} Z" fill="${cor}"
      ${opc.dicas ? `data-dica="${esc(d.l)}: ${esc(d.t || n0(d.v))}"` : ''}>
      <animate attributeName="opacity" from="0" to="1" dur="0.35s" fill="freeze"/></path>`;
    if (d.ref !== undefined) {
      const yr = padT + alturaUtil - alturaUtil * (d.ref / max);
      s += `<line x1="${x - 3}" x2="${x + largura + 3}" y1="${yr}" y2="${yr}" stroke="var(--foreground)"
        stroke-width="1.5" stroke-dasharray="4 3" opacity="0.65"/>`;
    }
    s += `<text x="${x + largura / 2}" y="${H - 10}" font-size="11" fill="var(--muted-foreground)"
      text-anchor="middle" font-family="Geist">${esc(d.l)}</text>`;
    if (opc.valores) s += `<text x="${x + largura / 2}" y="${y - 6}" font-size="11" fill="var(--foreground)"
      text-anchor="middle" font-family="Geist" font-weight="500">${d.t || n0(d.v)}</text>`;
  });
  return s + '</svg>';
}

/* ---------- agenda ---------- */
function cerimoniasVisiveis(r) {
  const ps = UI.pessoas, prs = UI.projetos;
  return r.alocadas.filter(ev =>
    (prs.length === 0 || prs.indexOf(ev.projetoId) >= 0) &&
    (ps.length === 0 || ev.participantes.some(p => ps.indexOf(p) >= 0)));
}
// distribui cerimônias sobrepostas em faixas lado a lado
function faixasDoDia(evs) {
  const ordenadas = [...evs].sort((a, b) => a.slot - b.slot || b.slots - a.slots);
  const fim = [];
  ordenadas.forEach(ev => {
    let f = 0;
    while (fim[f] !== undefined && fim[f] > ev.slot) f++;
    fim[f] = ev.slot + ev.slots;
    ev._faixa = f;
  });
  const total = Math.max(1, fim.length);
  ordenadas.forEach(ev => { ev._faixas = total; });
  return ordenadas;
}
const rotuloPessoas = () => UI.pessoas.length === 0 ? 'todas'
  : (UI.pessoas.length === 1 ? primeiro(MUNDO.pessoas[UI.pessoas[0]].nome) : UI.pessoas.length + ' pessoas');
const rotuloProjetos = () => UI.projetos.length === 0 ? 'todos'
  : (UI.projetos.length === 1 ? (MUNDO.projetos.find(p => p.id === UI.projetos[0]) || { nome: '1' }).nome
     : UI.projetos.length + ' clientes');
function painelFiltro() {
  if (!UI.painelFiltro) return '';
  const ehPessoas = UI.painelFiltro === 'pessoas';
  const termo = UI.buscaFiltro.trim().toLowerCase();
  const itens = ehPessoas
    ? MUNDO.pessoas.filter(x => !termo || x.nome.toLowerCase().indexOf(termo) >= 0)
        .map(x => ({ id: x.id, nome: x.nome, apoio: x.papel, on: UI.pessoas.indexOf(x.id) >= 0 }))
    : [...MUNDO.projetos].sort((a, b) => a.nome.localeCompare(b.nome))
        .filter(x => !termo || x.nome.toLowerCase().indexOf(termo) >= 0)
        .map(x => ({ id: x.id, nome: x.nome, apoio: FASES[x.fase].rotulo, on: UI.projetos.indexOf(x.id) >= 0 }));
  const sel = ehPessoas ? UI.pessoas.length : UI.projetos.length;
  const tot = ehPessoas ? MUNDO.pessoas.length : MUNDO.projetos.length;
  return `<div class="painel-filtro abre">
    <div class="filtro-cab">
      <input type="text" id="buscaFiltro" placeholder="${ehPessoas ? 'buscar pessoa' : 'buscar cliente'}"
        value="${esc(UI.buscaFiltro)}" aria-label="Buscar">
      <span class="meta">${sel === 0 ? 'todos os ' + tot : sel + ' de ' + tot} selecionados</span>
      <button class="mini-btn" data-sel-todos="1">Selecionar todos</button>
      <button class="mini-btn" data-sel-nenhum="1">Limpar seleção</button>
      <button class="mini-btn" data-fecha-filtro="1">Fechar</button>
    </div>
    <div class="filtro-lista">
      ${itens.length ? itens.map(x => `<button class="opcao" data-opcao="${x.id}" aria-pressed="${x.on}">
        <i></i><span>${esc(x.nome)}<em>${esc(x.apoio)}</em></span></button>`).join('')
        : '<p class="meta" style="padding:10px">Nada encontrado para esta busca.</p>'}
    </div>
    <p class="meta" style="margin-top:8px">Sem nada marcado, a agenda mostra ${ehPessoas ? 'o time inteiro' : 'todos os clientes'}.</p>
  </div>`;
}

function telaAgenda() {
  const w = semana1(), r = doCenario(w), G = GERAL, ALT = 31;

  const evsSemana = cerimoniasVisiveis(r);
  const resumoFiltro = `${evsSemana.length} cerimônias na semana, ${n1(evsSemana.reduce((s, e) => s + e.dur / 60, 0))}h`;

  const ferramentas = `<div class="ferramentas">

    ${UI.pessoas.length || UI.projetos.length ? '<button class="mini-btn" id="limparFiltros">limpar filtros</button>' : ''}
    <span class="meta" style="margin-left:auto">${resumoFiltro}</span>

  let corpo;
  if (UI.escala === 'semana') {
    const evs = evsSemana;
    const horasDia = [0, 0, 0, 0, 0];
    evs.forEach(ev => { horasDia[ev.dia] += ev.dur / 60; });

    let g = '<div class="grade"><div class="gh"><b>h</b></div>' + DIAS_LB.map((d, i) =>

    g += '<div class="horas">' + Array.from({ length: 20 }, (_, i) => `<div>${i % 2 === 0 ? hhmm(i) : ''}</div>`).join('') + '</div>';
    for (let d = 0; d < 5; d++) {
      g += `<div class="dia" style="height:${20 * ALT}px">`;
      if (G.inicio > 0) g += `<div class="zona z-fora" style="top:0;height:${G.inicio * ALT}px"></div>`;
      if (G.fim < 20) g += `<div class="zona z-fora" style="top:${G.fim * ALT}px;height:${(20 - G.fim) * ALT}px"></div>`;
      for (let s = G.inicio; s < G.fim; s++)
        if (G.preferidos.indexOf(s) < 0 && !(s >= G.almocoInicio && s < G.almocoInicio + G.almocoDur))
          g += `<div class="zona z-nopref" style="top:${s * ALT}px;height:${ALT}px"></div>`;

          data-dica="${esc(ev.tipo)}, ${esc(ev.projeto)}. ${hhmm(ev.slot)} às ${hhmm(ev.slot + ev.slots)}. Com ${esc(quem)}.${ev.relaxado ? ' Alocada com concessão de premissa.' : ''}${ev.sla ? ' Prazo de ' + ev.prazoDias + ' dias úteis.' : ''}">

    const tipos = [...new Set(evs.map(e => e.tipo))].sort();

      <b>Nenhuma cerimônia na semana 1</b>
      ${UI.projetos.length ? 'A cadência desta etapa não prevê cerimônia toda semana. A visão mensal mostra o ciclo completo.'

      m += `<div class="ml">Semana ${wi + 1}<span class="meta">${evs.length} cerim., ${n1(total)}h</span></div>`;
      for (let d = 0; d < 5; d++) {
        const dia = evs.filter(ev => ev.dia === d).sort((a, b) => a.slot - b.slot);
        const h = dia.reduce((s, ev) => s + ev.dur / 60, 0);
        m += `<div class="mc" data-vazio="${h ? 0 : 1}">
          ${h ? `<div class="mt">${n1(h)}h · ${dia.length}</div>` : ''}
          ${dia.slice(0, 6).map(ev => {
            const quem = ev.participantes.map(x => primeiro(MUNDO.pessoas[x].nome)).join(', ');
            const rotulo = UI.pessoas.length === 1 && !UI.projetos.length ? ev.projeto : quem;
            return `<button class="mcer" style="--fh:${hueCer(ev.tipo)}" data-cedido="${ev.relaxado ? 1 : 0}"
              data-dica="${esc(ev.tipo)}, ${esc(ev.projeto)}. ${hhmm(ev.slot)}. Com ${esc(quem)}.">
              <em>${hhmm(ev.slot)}</em> ${esc(ev.tipo.split(' ')[0])} · ${esc(rotulo.split(' ').slice(0, 2).join(' '))}</button>`;
          }).join('')}
          ${dia.length > 6 ? `<div class="meta" style="padding-left:4px">e mais ${dia.length - 6}</div>` : ''}
        </div>`;
      }
    });
    m += '</div>';
    corpo = m + `<p class="nota" style="margin-top:10px">Horizonte de ${CFG.horizonte} semanas.</p>`;
  }

  let lateral;
  if (!umaPessoa && !umProjeto) {
    lateral = painelAgregado(r, evsSemana);
  } else if (proj) {
    const hSem = r.alocadas.filter(e => e.projetoId === proj.id).reduce((s, e) => s + e.dur / 60 * e.participantes.length, 0);
    const F = 4.33 / CFG.horizonte;
    const hMes = SIM.semanas.reduce((s, sm) => s + doCenario(sm).alocadas.filter(e => e.projetoId === proj.id)
      .reduce((a, e) => a + e.dur / 60 * e.participantes.length, 0), 0) * F;
    const cMes = SIM.semanas.reduce((s, sm) => s + doCenario(sm).alocadas.filter(e => e.projetoId === proj.id).length, 0) * F;
    const et = etapaDe(CFG, proj.fase);
    lateral = `<div class="sec-cab"><h2>${esc(proj.nome)}</h2><span class="apoio">${seloFase(proj.fase)}</span></div>
      <table><tbody>
        <tr><td>Prioridade do cliente</td><td class="n">${proj.prioridade}, peso ${pesoCliente(CFG, proj.prioridade)}</td></tr>
        <tr><td>Urgência da etapa</td><td class="n">${et.urgencia} de 5</td></tr>
        <tr><td>Prazo da etapa</td><td class="n">${et.prazoDias} dias úteis</td></tr>
        <tr><td>Mês do projeto</td><td class="n">${proj.mes}</td></tr>
        <tr><td>Produtos</td><td class="n">${proj.produtos.relatorios}R · ${proj.produtos.dashboards}D · ${proj.produtos.integracoes}I</td></tr>
        <tr><td><b>Horas por semana</b></td><td class="n"><b>${n1(hSem)}</b></td></tr>
        <tr><td>Horas por mês</td><td class="n">${n1(hMes)}</td></tr>
        <tr><td>Cerimônias por mês</td><td class="n">${n0(cMes)}</td></tr>
        <tr><td>Health</td><td class="n"><span class="ponto" style="background:var(--${proj.health === 'verde' ? 'ok' : proj.health === 'amarelo' ? 'warn' : 'bad'})"></span>${proj.health}</td></tr>
      </tbody></table>
      <div class="sec-cab" style="margin-top:20px"><h2>Squad</h2><span class="apoio">${Object.keys(proj.squad).length} cadeiras</span></div>
      <table><tbody>${Object.entries(proj.squad).map(([pp, id]) => `<tr><td>${esc(pp)}</td>
        <td style="text-align:right">${id === undefined ? selo('cadeira vaga', 'ruim') : esc(MUNDO.pessoas[id].nome)}</td></tr>`).join('')}</tbody></table>`;
  } else {
    const projs = MUNDO.projetos.filter(x => Object.values(x.squad).indexOf(p.id) >= 0);
    const mes = SIM.mes[UI.cenario].porPessoa[p.id];
    const st = situacaoPessoa(k);
    lateral = `<div class="sec-cab"><h2>${esc(p.nome)}</h2><span class="apoio">${selo(st[1], st[0])}</span></div>
      <table><tbody>
        <tr><td>Cargo</td><td class="n">${esc(p.papel)}</td></tr>
        <tr><td>Capacidade líquida</td><td class="n">${n1(prem.Cl)} h</td></tr>
        <tr><td>Alvo de tempo produtivo</td><td class="n">${prem.produtivoMin}%</td></tr>
        <tr><td>Teto de reunião</td><td class="n">${n1(prem.teto)} h</td></tr>
        <tr><td>Limite aceitável</td><td class="n">${n1(prem.tetoMax)} h</td></tr>
        <tr><td><b>Horas em reunião</b></td><td class="n"><b style="color:var(--${k.acimaTeto ? 'bad' : 'ok'})">${n1(k.horas)} h</b></td></tr>
        <tr><td>Folga até o teto</td><td class="n">${n1(k.folga)} h</td></tr>
        <tr><td>Máx. dia, semana, mês</td><td class="n">${n1(prem.maxHorasDia)} · ${n1(prem.maxHorasSemana)} · ${n1(prem.maxHorasMes)} h</td></tr>
        <tr><td>Duração máxima</td><td class="n">${n1(prem.duracaoMax / 2)} h</td></tr>
        <tr><td>Blocos de foco</td><td class="n">${k.blocosFoco}</td></tr>
        <tr><td>Fragmentação</td><td class="n">${n1(k.frag * 100)}%</td></tr>
        <tr><td>Reuniões no mês</td><td class="n">${mes.reunioes}</td></tr>
        <tr><td>Horas no mês</td><td class="n">${n1(mes.horas)} h</td></tr>
      </tbody></table>
      <div class="sec-cab" style="margin-top:20px"><h2>Projetos</h2><span class="apoio">${projs.length} alocações</span></div>
      <div class="rolagem" style="max-height:230px"><table><tbody>
        ${projs.slice(0, 20).map(x => `<tr><td>
          <button class="mini-btn" data-abrir-proj="${x.id}" style="border:0;background:none;padding:0;font-size:12.2px;color:var(--ink)">${esc(x.nome)}</button>

      </tbody></table></div>`;
  }

  return `${ferramentas}<div class="colunas c-agenda sec"><section>${corpo}</section><section>${lateral}</section></div>`;
}

function painelAgregado(r, evs) {
  const pessoas = UI.pessoas.length ? UI.pessoas.map(id => MUNDO.pessoas[id]) : MUNDO.pessoas;
  const projetos = UI.projetos.length ? UI.projetos.map(id => MUNDO.projetos.find(p => p.id === id)).filter(Boolean) : MUNDO.projetos;
  const k = r.kpi;
  const horasPessoa = pessoas.map(x => ({ nome: x.nome, papel: x.papel, kp: k.porPessoa[x.id] }))
    .sort((a, b) => b.kp.horas - a.kp.horas);
  const porTipo = {};
  evs.forEach(ev => { porTipo[ev.tipo] = (porTipo[ev.tipo] || 0) + ev.dur / 60; });
  const pessoaHora = evs.reduce((s, e) => s + e.dur / 60 * e.participantes.length, 0);
  const acima = horasPessoa.filter(x => x.kp.acimaTeto).length;

  return `<div class="sec-cab"><h2>Seleção</h2>
    <span class="apoio">${UI.pessoas.length ? UI.pessoas.length + ' pessoas' : 'time inteiro'},
      ${UI.projetos.length ? UI.projetos.length + ' clientes' : 'todos os clientes'}</span></div>
    <table><tbody>
      <tr><td>Cerimônias na semana</td><td class="n">${evs.length}</td></tr>
      <tr><td>Horas de agenda</td><td class="n">${n1(evs.reduce((s, e) => s + e.dur / 60, 0))} h</td></tr>
      <tr><td>Pessoa-hora</td><td class="n">${n1(pessoaHora)} h</td></tr>
      <tr><td>Pessoas envolvidas</td><td class="n">${new Set(evs.flatMap(e => e.participantes)).size}</td></tr>
      <tr><td>Projetos envolvidos</td><td class="n">${new Set(evs.map(e => e.projetoId)).size}</td></tr>
      <tr><td>Com concessão</td><td class="n" style="color:var(--${evs.filter(e => e.relaxado).length ? 'warn' : 'ink'})">${evs.filter(e => e.relaxado).length}</td></tr>
      <tr><td>Acima do teto do cargo</td><td class="n" style="color:var(--${acima ? 'bad' : 'ok'})">${acima} de ${pessoas.length}</td></tr>
    </tbody></table>

    <div class="sec-cab" style="margin-top:20px"><h2>Carga por pessoa</h2><span class="apoio">semana, contra o teto do cargo</span></div>
    <div class="rolagem" style="max-height:250px"><table><tbody>
      ${horasPessoa.slice(0, 24).map(x => {
        const ocup = x.kp.teto > 0 ? x.kp.horas / x.kp.teto * 100 : 0;
        return `<tr><td>${esc(x.nome)}<div class="meta">${esc(x.papel)}</div></td>
          <td style="width:92px">${trilha(Math.min(ocup, 100), 100, 100, ocup > 100 ? 'ruim' : (ocup > 85 ? '' : 'ok'))}</td>
          <td class="n" style="width:54px">${n1(x.kp.horas)}h</td></tr>`;
      }).join('')}
    </tbody></table></div>

    ${Object.keys(porTipo).length ? `<div class="sec-cab" style="margin-top:20px"><h2>Por tipo</h2>
      <span class="apoio">horas de agenda</span></div>
      <table><tbody>${Object.entries(porTipo).sort((a, b) => b[1] - a[1]).map(([t, v]) =>
        `<tr><td><span class="tag-cer" style="--fh:${hueCer(t)}">${esc(t)}</span></td>
        <td class="n">${n1(v)}h</td></tr>`).join('')}</tbody></table>` : ''}`;
}

/* ---------- otimizador ---------- */
function telaOtimizador() {
  const w = semana1(), b = w.base.kpi, o = w.otm.kpi, R = w.otm;
  const perfil = PERFIS[CFG.perfil] || PERFIS.equilibrio;
  const conc = R.concessoes || [], trocas = R.trocas || [], adi = R.adiadas;

  const quadro = PAPEIS.map(pp => {
    const ps = o.porPessoa.filter(x => x.papel === pp);
    if (!ps.length) return null;
    const c = premDe(CFG, pp), def = R.deficit[pp];
    return {
      pp, n: ps.length, alvo: c.produtivoMin, tol: c.tolerancia, teto: c.teto, tetoMax: c.tetoMax,
      limitado: c.limitadoPorHoras, maxMes: c.maxHorasMes,
      carga: ps.reduce((s, x) => s + x.horas, 0) / ps.length,
      hMes: ps.reduce((s, x) => s + SIM.mes[UI.cenario].porPessoa[x.id].horas, 0) / ps.length,
      produtivo: ps.reduce((s, x) => s + x.produtivo, 0) / ps.length,
      noAlvo: ps.filter(x => x.noAlvo).length,
      cessoes: conc.filter(x => x.papel === pp).length,
      fte: def ? def.fte : 0, fteObrig: def ? def.fteObrig : 0
    };
  }).filter(Boolean);
  const fteObrig = quadro.reduce((s, x) => s + x.fteObrig, 0);
  const porPremissa = {};
  conc.forEach(c => { porPremissa[c.premissa] = (porPremissa[c.premissa] || 0) + 1; });
  const gargalo = {};
  adi.forEach(a => a.papeis.forEach(pp => { gargalo[pp] = (gargalo[pp] || 0) + 1; }));
  const gargaloTop = Object.entries(gargalo).sort((a, c) => c[1] - a[1])[0];

  const comparacao = [
    ['Tempo produtivo médio', pc(b.produtivoMedio), pc(o.produtivoMedio), o.produtivoMedio - b.produtivoMedio, false],
    ['Aderência ao alvo do cargo', pc(b.aderencia), pc(o.aderencia), o.aderencia - b.aderencia, false],
    ['Cobertura do playbook', pc(100 * w.base.alocadas.length / w.demanda.length), pc(R.cobertura.total),
      R.cobertura.total - 100 * w.base.alocadas.length / w.demanda.length, false],
    ['Pessoas com concessão', String(b.acimaTeto), String(o.acimaTeto), o.acimaTeto - b.acimaTeto, true],
    ['Acima do limite aceitável', String(b.acimaLimite), String(o.acimaLimite), o.acimaLimite - b.acimaLimite, true],
    ['Blocos de foco por pessoa', n1(b.blocosFocoMedio), n1(o.blocosFocoMedio), o.blocosFocoMedio - b.blocosFocoMedio, false],
    ['Fragmentação média', n1(b.fragMedia * 100) + '%', n1(o.fragMedia * 100) + '%', (o.fragMedia - b.fragMedia) * 100, true],
    ['Horas de cerimônia na semana', n1(b.horasTotais) + 'h', n1(o.horasTotais) + 'h', o.horasTotais - b.horasTotais, true]
  ];

  const indicadores = faixa([
    indicador('Aderência ao alvo', n1(o.aderencia), { un: '%', tom: o.aderencia >= 95 ? 'bom' : (o.aderencia < 70 ? 'ruim' : ''),
      contexto: `${o.porPessoa.filter(x => x.noAlvo).length} de ${MUNDO.pessoas.length} pessoas` }),
    indicador('Cobertura total', n1(R.cobertura.total), { un: '%', tom: R.cobertura.total >= 95 ? 'bom' : 'ruim',
      contexto: `${R.alocadas.length} de ${w.demanda.length} cerimônias` }),
    indicador('Com concessão', String(R.cobertura.relaxadas), { tom: R.cobertura.relaxadas ? '' : 'bom',
      contexto: R.cobertura.relaxadas ? `${conc.length} premissas cedidas` : 'nada precisou ser cedido' }),
    indicador('SLA de etapa', n1(R.cobertura.sla), { un: '%', tom: R.cobertura.sla >= 100 ? 'bom' : 'ruim',
      contexto: `${R.cobertura.slaTotal} com prazo crítico` }),
    indicador('Adiadas', String(adi.length), { tom: adi.length ? 'ruim' : 'bom',
      contexto: adi.length ? `${adi.filter(a => a.obrig).length} obrigatórias` : 'nenhuma pendência' }),
    indicador('Déficit estrutural', n1(fteObrig), { un: 'FTE', tom: fteObrig > 0.5 ? 'ruim' : 'bom',
      contexto: gargaloTop && fteObrig > 0 ? `concentrado em ${esc(gargaloTop[0])}` : 'capacidade suficiente' })
  ]);

  const abas = [
    ['resultado', 'Resultado', 'desejado contra possível'],
    ['concessoes', 'Concessões', conc.length + ' registradas'],
    ['trocas', 'Trocas de cadeira', trocas.length + ' aplicadas'],
    ['pendencias', 'Não atendida', adi.length + ' cerimônias']
  ];

  const painelResultado = `
    <div class="larga"><table style="min-width:860px"><thead><tr>
      <th>Cargo</th><th class="n">Alvo</th><th class="n">Tol.</th><th class="n">Teto/sem</th><th class="n">Limite</th>
      <th class="n">Carga</th><th class="n">h/mês</th><th class="n">Máx mês</th><th class="n">Produtivo</th>
      <th class="n">No alvo</th><th class="n">Concessões</th><th class="n">Déficit</th><th>Leitura</th>
    </tr></thead><tbody>
      ${quadro.map(x => {
        const leitura = x.fteObrig > 0.3 ? selo('falta capacidade', 'ruim')
          : x.cessoes ? selo('alvo cedido', 'aviso')
          : x.carga < x.teto * 0.5 ? selo('folga', 'neutro') : selo('alvo atingido', 'ok');
        return `<tr><td><b>${esc(x.pp)}</b><div class="meta">${x.n} pessoa(s)</div></td>
          <td class="n">${x.alvo}%</td><td class="n calc">${x.tol}</td>
          <td class="n">${n1(x.teto)}h${x.limitado ? '<div class="meta" style="color:var(--accent)">absoluto</div>' : ''}</td>
          <td class="n calc">${n1(x.tetoMax)}h</td>
          <td class="n" style="color:var(--${x.carga > x.teto ? 'bad' : 'ink'})">${n1(x.carga)}h</td>
          <td class="n" style="color:var(--${x.hMes > x.maxMes ? 'bad' : 'ink'})">${n1(x.hMes)}h</td>
          <td class="n calc">${n1(x.maxMes)}h</td>
          <td class="n">${n1(x.produtivo)}%</td><td class="n">${x.noAlvo}/${x.n}</td>
          <td class="n">${x.cessoes || 0}</td><td class="n">${x.fteObrig ? n1(x.fteObrig) : '0,0'}</td>
          <td>${leitura}</td></tr>`;
      }).join('')}
    </tbody></table></div>
    <p class="nota" style="margin:9px 0 22px">Déficit conta as horas de cerimônia obrigatória que não couberam nem com
      tolerância, convertidas em equivalente de pessoa daquele cargo.</p>
    <div class="sec-cab"><h2>Resultado contra a agenda atual</h2><span class="apoio">semana 1</span></div>
    <table><thead><tr><th>Indicador</th><th class="n">Atual</th><th class="n">Otimizado</th><th class="n">Δ</th></tr></thead>
    <tbody>${comparacao.map(l => {
      const bom = l[4] ? l[3] < 0 : l[3] > 0;
      const cor = Math.abs(l[3]) < 0.05 ? 'var(--ink-3)' : (bom ? 'var(--ok)' : 'var(--bad)');
      return `<tr><td>${l[0]}</td><td class="n">${l[1]}</td><td class="n">${l[2]}</td>
        <td class="n" style="color:${cor}">${l[3] > 0 ? '+' : ''}${n1(l[3])}</td></tr>`;
    }).join('')}</tbody></table>`;

  const painelConcessoes = conc.length ? `<div class="rolagem" style="max-height:440px"><table><thead><tr>
      <th>Pessoa</th><th>Cargo</th><th>Premissa cedida</th><th class="n">Alvo</th><th class="n">Aplicado</th><th>Motivo</th>
    </tr></thead><tbody>${conc.map(c => `<tr><td>${esc(c.pessoa)}</td><td class="meta">${esc(c.papel)}</td>
      <td>${esc(c.premissa)}</td><td class="n">${n1(c.alvo)}${c.un}</td>
      <td class="n" style="color:var(--warn)">${n1(c.valor)}${c.un}</td>
      <td class="meta">${esc(c.cerimonia)}, ${esc(c.projeto)}</td></tr>`).join('')}</tbody></table></div>
    <p class="nota" style="margin-top:9px">Toda cessão de premissa é registrada com o valor alvo, o valor aplicado e a
      cerimônia que motivou. Nenhuma delas ultrapassa o limite aceitável do cargo.</p>`
    : `<div class="vazio">${'<div class="media"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg></div>'}<b>Nenhuma premissa cedida</b>Toda a demanda coube dentro do alvo de cada cargo.</div>`;

  const painelTrocas = trocas.length ? `<div class="rolagem" style="max-height:440px"><table><thead><tr>
      <th>Projeto</th><th>Cerimônia</th><th>Cargo</th><th>Sai</th><th>Entra</th></tr></thead><tbody>
      ${trocas.map(t => `<tr><td>${esc(t.ev.projeto)}</td><td>${esc(t.ev.tipo)}</td>
        <td class="meta">${esc(t.subs[0].papel)}</td><td>${esc(MUNDO.pessoas[t.subs[0].de].nome)}</td>
        <td><b>${esc(MUNDO.pessoas[t.subs[0].para].nome)}</b></td></tr>`).join('')}</tbody></table></div>
    <p class="nota" style="margin-top:9px">A camada 2 troca o participante por outro do mesmo cargo com folga no alvo,
      antes de qualquer concessão. Nenhuma premissa é cedida aqui.</p>`
    : `<div class="vazio">${'<div class="media"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg></div>'}<b>Nenhuma troca necessária</b>Todos os participantes previstos tinham folga no próprio alvo.</div>`;

  const painelPendencias = adi.length ? `<div class="rolagem" style="max-height:440px"><table><thead><tr>
      <th>Projeto</th><th>Cerimônia</th><th>Cargos</th><th>Tipo</th><th>Motivo</th><th class="n">Min</th>
    </tr></thead><tbody>${adi.map(a => `<tr><td>${esc(a.projeto)}</td><td>${esc(a.tipo)}</td>
      <td class="meta">${esc(a.papeis.join(', '))}</td>
      <td>${a.sla ? selo('SLA ' + a.prazoDias + 'd', 'ruim') : (a.obrig ? selo('obrigatória', 'aviso') : selo('opcional', 'neutro'))}</td>
      <td class="meta">${esc(a.motivo)}</td><td class="n">${a.dur}</td></tr>`).join('')}</tbody></table></div>
    <p class="nota" style="margin-top:9px">O que sobra aqui não é problema de agenda, é falta de capacidade. As saídas são
      contratar, baixar a cadência do playbook ou reduzir o alvo do cargo.</p>`
    : `<div class="vazio">${'<div class="media"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg></div>'}<b>Toda a demanda foi atendida</b>Nenhuma cerimônia ficou fora do plano.</div>`;

  const paineis = { resultado: painelResultado, concessoes: painelConcessoes, trocas: painelTrocas, pendencias: painelPendencias };

  return indicadores + `
  <div class="colunas c-ba sec">
    <section class="painel">
      <header><h3>Cenário</h3></header>
      <div class="corpo">
        <div class="campo"><label for="selHoriz">Horizonte de planejamento</label>
          <select id="selHoriz">${[2, 4, 6, 8].map(h => `<option value="${h}" ${CFG.horizonte === h ? 'selected' : ''}>${h} semanas</option>`).join('')}</select></div>
        <div class="campo"><label for="selPerfil">Perfil de otimização</label>
          <select id="selPerfil">${Object.entries(PERFIS).map(([k2, v]) =>
            `<option value="${k2}" ${CFG.perfil === k2 ? 'selected' : ''}>${v.rotulo}</option>`).join('')}</select>
          <span class="dica">${esc(perfil.desc)}</span></div>
        <button class="chave" id="chaveReb" aria-pressed="${CFG.rebalancear}"><i></i>Rebalancear cadeiras</button>
        <div class="campo"><label>O que este perfil autoriza ceder</label>
          <table><tbody>
            <tr><td>Tolerância usada</td><td class="n">${n0(perfil.usaTolerancia * 100)}%</td></tr>
            <tr><td>Reuniões por dia</td><td class="n">+${perfil.extraReunioes}</td></tr>
            <tr><td>Horas por dia</td><td class="n">+${n1(perfil.extraHoras)}h</td></tr>
            <tr><td>Janela protegida</td><td class="n">${perfil.cedeJanela ? 'cede' : 'preserva'}</td></tr>
            <tr><td>Fila</td><td class="n">${perfil.fila === 'criticidade' ? 'criticidade' : 'prioridade'}</td></tr>
          </tbody></table></div>
        <div class="campo"><label>Premissas por cargo</label>
          <table><tbody>${PAPEIS.map(pp => { const c = premDe(CFG, pp);
            return `<tr><td>${esc(pp)}</td><td class="n">${c.produtivoMin}%</td><td class="n">${n1(c.teto)}h</td></tr>`; }).join('')}</tbody></table>
          <button class="mini-btn" id="btnIrPremissas" style="justify-self:start">Editar premissas</button></div>
      </div>
    </section>

    <div>
      <section class="sec">
        <div class="sec-cab"><h2>Execução em três camadas</h2>
          <span class="apoio" id="tempoExec">solver ${MS} ms, ${MUNDO.projetos.length} projetos, ${MUNDO.pessoas.length} pessoas</span></div>
        <div class="terminal" id="terminal"></div>
      </section>
      <section class="sec">
        <div class="sec-cab"><h2>Leitura do agente</h2><span class="apoio">Levi, narrador</span></div>
        <p class="leitura">
          Com o perfil <b>${esc(perfil.rotulo)}</b>, o plano cobre <b>${pc(R.cobertura.total)}</b> da demanda do playbook
          (${pc(R.cobertura.obrigatoria)} das obrigatórias) e mantém <b>${pc(o.aderencia)}</b> do time dentro do alvo do
          próprio cargo.
          ${R.cobertura.relaxadas
            ? `Para chegar lá, ${R.cobertura.relaxadas} cerimônia(s) foram alocadas com concessão:
               ${Object.entries(porPremissa).map(([k2, v]) => `${v} de ${k2}`).join(', ')}.`
            : 'Nenhuma premissa precisou ser cedida.'}
          ${adi.length
            ? `Sobraram <b>${adi.length} cerimônia(s)</b> fora do plano${fteObrig > 0
                ? `, o equivalente a <b>${n1(fteObrig)} FTE</b>${gargaloTop ? ` em ${esc(gargaloTop[0])}` : ''}`
                : ', todas opcionais'}.`
            : 'Toda a demanda do playbook coube no plano.'}
          ${trocas.length ? `A camada 2 resolveu ${trocas.length} caso(s) apenas trocando a cadeira.` : ''}
        </p>
      </section>
    </div>
  </div>

  <section class="sec">
    <div class="abas" role="tablist">${abas.map(a =>
      `<button class="aba" role="tab" data-aba-otim="${a[0]}" aria-selected="${UI.abaOtimizador === a[0]}">
        ${a[1]}<em>${a[2]}</em></button>`).join('')}</div>
    <div role="tabpanel">${paineis[UI.abaOtimizador]}</div>
  </section>`;
}

function escreverTerminal(animado) {
  const c = document.getElementById('terminal');
  if (!c) return;
  const w = semana1(), o = w.otm, PF = o.perfil;
  const noAlvo = o.alocadas.filter(x => !x.relaxado).length;
  const fte = Object.values(o.deficit).reduce((s, x) => s + x.fteObrig, 0);
  const linhas = [
    ['cmd', `> cadencia optimize --horizonte ${CFG.horizonte}w --perfil ${o.perfilId || CFG.perfil}`],
    ['', `planejador  ${w.demanda.length} cerimônias derivadas do playbook`],
    ['', `premissas   ${PAPEIS.length} cargos, alvo ${PAPEIS.map(p => premDe(CFG, p).produtivoMin).join('/')}%`],
    ['bom', `camada 1    ${noAlvo} alocadas dentro do alvo, sem ceder nada`],
    [(o.trocas || []).length ? 'at' : '', `camada 2    ${(o.trocas || []).length} resolvidas trocando a cadeira`],
    [o.cobertura.relaxadas ? 'at' : 'bom', `camada 3    ${o.cobertura.relaxadas} com concessão, tolerância a ${n0(PF.usaTolerancia * 100)}%`],
    [o.adiadas.length ? 'at' : 'bom', `residual    ${o.adiadas.length} sem solução, déficit ${n1(fte)} FTE`],
    ['bom', `KPI         cobertura ${pc(o.cobertura.total)}, aderência ${pc(o.kpi.aderencia)}`],
    ['bom', `> plano pronto para publicação`]
  ];
  c.innerHTML = '';
  linhas.forEach((l, i) => {
    const d = document.createElement('div');
    d.className = l[0]; d.textContent = l[1];
    d.style.animationDelay = (animado ? i * 0.13 : 0) + 's';
    c.appendChild(d);
  });
}

/* ---------- projetos ---------- */
function telaProjetos() {
  const w = semana1(), r = doCenario(w), F = 4.33 / CFG.horizonte;
  const hSem = {}, cSem = {}, hMes = {};
  r.alocadas.forEach(ev => {
    hSem[ev.projetoId] = (hSem[ev.projetoId] || 0) + ev.dur / 60 * ev.participantes.length;
    cSem[ev.projetoId] = (cSem[ev.projetoId] || 0) + 1;
  });
  SIM.semanas.forEach(sm => doCenario(sm).alocadas.forEach(ev => {
    hMes[ev.projetoId] = (hMes[ev.projetoId] || 0) + ev.dur / 60 * ev.participantes.length * F;
  }));

  const etapas = {};
  Object.keys(FASES).forEach(f => { etapas[f] = { projetos: 0, cer: 0, h: 0, hMes: 0 }; });
  MUNDO.projetos.forEach(p => { if (etapas[p.fase]) etapas[p.fase].projetos++; });
  r.alocadas.forEach(ev => { etapas[ev.fase].cer++; etapas[ev.fase].h += ev.dur / 60 * ev.participantes.length; });
  SIM.semanas.forEach(sm => doCenario(sm).alocadas.forEach(ev => { etapas[ev.fase].hMes += ev.dur / 60 * ev.participantes.length * F; }));
  const totalMes = Object.values(etapas).reduce((s, x) => s + x.hMes, 0) || 1;

  const termo = UI.busca.trim().toLowerCase();
  const lista = MUNDO.projetos
    .filter(p => UI.faseFiltro === 'todas' || p.fase === UI.faseFiltro)
    .filter(p => UI.timeFiltro === 'todos' || p.timeId === +UI.timeFiltro)
    .filter(p => !termo || p.nome.toLowerCase().indexOf(termo) >= 0);
  const incompletos = MUNDO.projetos.filter(p => squadIncompleto(MUNDO, p).length);

  return `
    <section class="sec">
      <div class="sec-cab"><h2>Horas de reunião por etapa</h2>
        <span class="apoio">pessoa-hora, ${UI.cenario === 'otm' ? 'plano otimizado' : 'agenda vigente'}</span></div>
      <table><thead><tr><th>Etapa</th><th class="n">Projetos</th><th class="n">Urgência</th><th class="n">Prazo</th>
        <th class="n">Cerim./sem</th><th class="n">h/semana</th><th class="n">h/mês</th><th class="n">h/mês por projeto</th>
        <th style="width:170px">Participação nas horas</th></tr></thead><tbody>
        ${Object.entries(FASES).map(([f, v]) => { const x = etapas[f], et = etapaDe(CFG, f);
          return `<tr><td>${seloFase(f)}</td><td class="n">${x.projetos}</td>
            <td class="n">${et.urgencia} de 5</td><td class="n">${et.prazoDias}d</td>
            <td class="n">${x.cer}</td><td class="n">${n1(x.h)}</td><td class="n">${n1(x.hMes)}</td>
            <td class="n">${x.projetos ? n1(x.hMes / x.projetos) : '0,0'}</td>
            <td>${trilha(x.hMes, totalMes)}<div class="meta">${n1(x.hMes / totalMes * 100)}%</div></td></tr>`; }).join('')}
      </tbody></table>
    </section>

    <section class="sec">
      <div class="sec-cab"><h2>Projetos</h2>
        <span class="apoio">
          <input type="text" id="buscaProj" placeholder="buscar cliente" value="${esc(UI.busca)}"
            aria-label="Buscar cliente" style="width:170px">
          <select id="filtroTime" aria-label="Filtrar por time">
            <option value="todos" ${UI.timeFiltro === 'todos' ? 'selected' : ''}>Todos os times</option>
            ${MUNDO.times.map(t => `<option value="${t.id}" ${UI.timeFiltro === String(t.id) ? 'selected' : ''}>${esc(t.nome)} (${projetosDoTime(MUNDO, t.id).length})</option>`).join('')}
          </select>
          <select id="filtroFase" aria-label="Filtrar por fase">
            <option value="todas" ${UI.faseFiltro === 'todas' ? 'selected' : ''}>Todas as fases (${MUNDO.projetos.length})</option>
            ${Object.entries(FASES).map(([k2, v]) => `<option value="${k2}" ${UI.faseFiltro === k2 ? 'selected' : ''}>
              ${v.rotulo} (${MUNDO.projetos.filter(p => p.fase === k2).length})</option>`).join('')}
          </select>
          <button class="btn" id="btnNovoProjeto">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
            Novo projeto</button>
        </span></div>

      ${incompletos.length ? `<p class="aviso">${incompletos.length} projeto(s) com squad incompleto.
        As cerimônias que dependem do cargo ausente não entram na otimização por falta de quórum.</p>` : ''}

      ${lista.length ? `<div class="rolagem"><table><thead><tr>
        <th>Cliente e projeto</th><th>Fase</th><th>Time</th><th class="n">Mês</th><th>Prioridade</th><th>Produtos</th><th>Squad</th>
        <th class="n">Cerim./sem</th><th class="n">h/semana</th><th class="n">h/mês</th><th>Health</th><th style="width:120px"></th>
      </tr></thead><tbody>
        ${lista.map(p => {
          const falta = squadIncompleto(MUNDO, p);
          const prod = p.produtos.relatorios + p.produtos.dashboards + p.produtos.integracoes;
          return `<tr>
            <td><b>${esc(p.nome)}</b>${falta.length ? `<div class="meta" style="color:var(--bad)">falta ${esc(falta.join(', '))}</div>` : ''}</td>
            <td>${seloFase(p.fase)}</td>

        <path d="M12 9v4M12 17h.01M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/></svg>

function abaTimes() {
  const w = semana1(), k = doCenario(w).kpi, F = 4.33 / CFG.horizonte;
  const horasTime = {};
  SIM.semanas.forEach(sm => doCenario(sm).alocadas.forEach(ev => {
    const pr = MUNDO.projetos.find(p => p.id === ev.projetoId);
    if (!pr) return;
    horasTime[pr.timeId] = (horasTime[pr.timeId] || 0) + ev.dur / 60 * ev.participantes.length * F;
  }));

  return `<section class="sec">
    <div class="sec-cab"><h2>Times de implantação</h2>
      <span class="apoio">cada projeto pertence a um time e só usa gente dele
        <button class="btn" id="btnNovoTime">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
          Novo time</button></span></div>
    <p class="nota" style="margin-bottom:12px">O squad de cada projeto é montado a partir dos membros do time, pelo cargo
      que a etapa exige e pela menor carga. Se o time não tem alguém do cargo obrigatório, a cerimônia fica sem quórum e
      não entra no plano. É isso que impede colocar qualquer pessoa em qualquer projeto.</p>
    <div class="larga"><table style="min-width:960px"><thead><tr>
      <th>Time</th><th class="n">Pessoas</th><th>Composição por cargo</th><th class="n">Projetos</th>
      <th class="n">Cerim./sem</th><th class="n">h/mês</th><th style="width:150px">Ocupação do time</th>
      <th>Cobertura de cargos</th><th style="width:130px"></th>
    </tr></thead><tbody>
      ${MUNDO.times.map(t => {
        const membros = membrosDoTime(MUNDO, t.id);
        const projs = projetosDoTime(MUNDO, t.id);
        const comp = cargosDoTime(MUNDO, t.id);
        const cer = doCenario(w).alocadas.filter(ev => {
          const pr = MUNDO.projetos.find(p => p.id === ev.projetoId); return pr && pr.timeId === t.id;
        }).length;
        const capac = membros.reduce((s, id) => s + premDe(CFG, MUNDO.pessoas[id].papel).teto, 0);
        const carga = membros.reduce((s, id) => s + k.porPessoa[id].horas, 0);
        const ocup = capac > 0 ? carga / capac * 100 : 0;
        // cargos exigidos pelas fases dos projetos deste time
        const exigidos = [...new Set(projs.flatMap(p => papeisNecessarios(p.fase)))];
        const faltando = exigidos.filter(pp => !comp[pp]);
        return `<tr>
          <td><b>${esc(t.nome)}</b></td>
          <td class="n">${membros.length}</td>
          <td>${Object.entries(comp).map(([pp, n]) =>
            `<span class="selo neutro" style="margin-right:4px">${esc(pp)} ${n}</span>`).join('') || '<span class="meta">vazio</span>'}</td>
          <td class="n">${projs.length}</td><td class="n">${cer}</td><td class="n">${n1(horasTime[t.id] || 0)}</td>
          <td>${trilha(Math.min(ocup, 100), 100, 100, ocup > 100 ? 'ruim' : (ocup > 85 ? '' : 'ok'))}
            <div class="meta">${n0(ocup)}% do teto somado</div></td>
          <td>${faltando.length ? selo('falta ' + esc(faltando.join(', ')), 'ruim') : selo('cobre as etapas', 'ok')}</td>
          <td><span class="acoes"><button class="mini-btn" data-edita-time="${t.id}">editar</button>
            ${MUNDO.times.length > 1 ? `<button class="mini-btn perigo" data-exclui-time="${t.id}">excluir</button>` : ''}</span></td>
        </tr>`;
      }).join('')}
    </tbody></table></div>
  </section>`;
}

          <td class="n">${uso.cerimonias}</td><td class="n">${n1(carga)}h</td>
          <td>${sit}</td>
          <td><span class="acoes"><button class="mini-btn" data-edita-cargo="${esc(pp)}">renomear</button>
               <button class="mini-btn perigo" data-exclui-cargo="${esc(pp)}">excluir</button></span></td>
        </tr>
        `;
      }).join('')}
    </tbody></table>
    <p class="nota" style="margin-top:10px">Os valores de cada cargo, alvo, tolerância e os quatro tetos de tempo,
      são editados em <b>Premissas, aba Por cargo</b>. Aqui ficam o cadastro, o nome e quem ocupa.
      <button class="mini-btn" id="btnIrPremissasCargo" style="margin-left:6px">Abrir premissas por cargo</button></p>
  </section>`;
}

/* ---------- premissas ---------- */

];
const CAMPOS = [
  { k: 'jornada', lb: 'Jornada', un: 'h/sem', min: 20, max: 44, passo: 1, esc: 1, dica: 'jornada contratual semanal' },
  { k: 'fatorAusencia', lb: 'Ausência', un: '%', min: 0, max: 35, passo: 1, esc: 1, dica: 'férias, feriados e treinamentos' },
  { k: 'tempoInstitucional', lb: 'Institucional', un: 'h/sem', min: 0, max: 12, passo: 0.5, esc: 1, dica: 'rituais internos da LeverPro' },
  { k: 'produtivoMin', lb: 'Produtivo', un: '%', min: 40, max: 95, passo: 1, esc: 1, dica: 'o que queremos: piso de tempo livre de reunião' },
  { k: 'tolerancia', lb: 'Tolerância', un: 'p.p.', min: 0, max: 20, passo: 1, esc: 1, dica: 'quanto o cargo aceita ceder do alvo quando não há alternativa' },
  { k: 'maxReunioesDia', lb: 'Reuniões', un: 'por dia', min: 1, max: 10, passo: 1, esc: 1, dica: 'número máximo de reuniões num mesmo dia' },
  { k: 'maxHorasDia', lb: 'Horas', un: 'por dia', min: 0.5, max: 8, passo: 0.5, esc: 1, dica: 'tempo máximo de reunião em um dia' },
  { k: 'maxHorasSemana', lb: 'Horas', un: 'por semana', min: 1, max: 30, passo: 0.5, esc: 1, dica: 'teto absoluto semanal, vale mesmo que o alvo permitisse mais' },
  { k: 'maxHorasMes', lb: 'Horas', un: 'por mês', min: 4, max: 120, passo: 1, esc: 1, dica: 'orçamento mensal acumulado, aplicado pró-rata no horizonte' },
  { k: 'duracaoMax', lb: 'Reunião', un: 'máx. h', min: 0.5, max: 4, passo: 0.5, esc: 2, dica: 'maior reunião de que este cargo participa' },

  { k: 'focoProt', lb: 'Janela', un: 'protegida h', min: 0, max: 4, passo: 0.5, esc: 2, dica: 'bloco diário sem alocação, no início da jornada' }
];
const campoDe = k => CAMPOS.find(c => c.k === k);

    ['gerais', 'Gerais', 'jornada, intervalos e horários'],
    ['cargo', 'Por cargo', PAPEIS.length + ' cargos, ' + CAMPOS.length + ' campos'],

}

function abaGerais() {
  const G = GERAL;
  const opcSlot = (sel, de, ate) => { let o = '';
    for (let s = de; s <= ate; s++) o += `<option value="${s}" ${sel === s ? 'selected' : ''}>${hhmm(s)}</option>`; return o; };
  return `<div class="colunas c-ab sec">
    <section class="painel"><header><h3>Jornada e intervalos</h3></header>
      <div class="corpo" style="grid-template-columns:1fr 1fr;display:grid">
        <div class="campo"><label for="gInicio">Início da jornada</label><select id="gInicio">${opcSlot(G.inicio, 0, 8)}</select></div>
        <div class="campo"><label for="gFim">Fim da jornada</label><select id="gFim">${opcSlot(G.fim, 12, 20)}</select></div>
        <div class="campo"><label for="gAlmoco">Início do almoço</label><select id="gAlmoco">${opcSlot(G.almocoInicio, 6, 12)}</select></div>
        <div class="campo"><label for="gAlmocoDur">Duração do almoço</label><select id="gAlmocoDur">
          ${[1, 2, 3].map(v => `<option value="${v}" ${G.almocoDur === v ? 'selected' : ''}>${n1(v / 2)}h</option>`).join('')}</select></div>
        <div class="campo"><label for="gBuffer">Intervalo entre reuniões</label><select id="gBuffer">
          ${[0, 1, 2].map(v => `<option value="${v}" ${G.buffer === v ? 'selected' : ''}>${v === 0 ? 'sem intervalo' : v * 30 + ' min'}</option>`).join('')}</select>
          <span class="dica">Respiro obrigatório antes e depois de cada cerimônia.</span></div>
        <div class="campo"><label for="gDia">Dia protegido</label><select id="gDia">
          ${[['nenhum', 'nenhum'], ['sexta-tarde', 'sexta à tarde'], ['sexta', 'sexta-feira inteira']].map(([v, t]) =>
            `<option value="${v}" ${G.diaProtegido === v ? 'selected' : ''}>${t}</option>`).join('')}</select></div>
        <div class="campo" style="grid-column:1/-1"><label for="gPeso">Força da preferência de horário</label>
          <div style="display:flex;align-items:center;gap:12px">
            <input type="range" id="gPeso" min="0" max="4" step="0.5" value="${G.pesoPreferencia}" style="flex:1">
            <span class="mono" id="gPesoV" style="width:34px;text-align:right;color:var(--accent)">${n1(G.pesoPreferencia)}</span></div>
          <span class="dica">Zero ignora a faixa preferencial, quatro só sai dela sem alternativa.</span></div>
      </div>
    </section>
    <section>
      <div class="sec-cab"><h2>Melhores horários para reunião</h2>
        <span class="apoio">${G.preferidos.filter(s => s >= G.inicio && s < G.fim).length / 2}h marcadas</span></div>
